import io.izzel.arclight.gradle.tasks.AssembleDistributionTask
import io.izzel.arclight.gradle.tasks.BundleJarJarTask

plugins {
    id 'architectury-plugin'
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    neoForge {
    }
}

configurations {
    // Libraries that must keep their original package names and therefore cannot be merged
    // into the mod JAR: the mod JAR is an automatic module exporting every package it
    // contains, so a merged copy clashes with the same library shipped by any other mod.
    jarJarBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    neoForge libs.neoforge

    implementation libs.izzel.tools
    implementation libs.arclight.api
    implementation libs.mixin.tools

    shadowBundle(libs.izzel.tools) { transitive = false }
    shadowBundle(libs.arclight.api) { transitive = false }
    shadowBundle(libs.mixin.tools) { transitive = false }
    shadowBundle(project(':i18n-config')) {
        transitive = true
        exclude group: 'org.apache.logging.log4j'
        exclude group: 'com.google.guava'
        exclude group: 'org.checkerframework'
        exclude group: 'org.yaml'
    }
    // Bukkit plugins resolve org.yaml.snakeyaml by its original name, so it is nested instead
    // of relocated. Mods commonly ship it through jar-in-jar as well and NeoForge keeps a
    // single copy per group:artifact.
    jarJarBundle('org.yaml:snakeyaml:2.2') { transitive = false }
    shadowBundle(libs.jline) { transitive = false }
    shadowBundle(libs.specialsource) { transitive = false }
    shadowBundle(libs.mysql.connectorj) { transitive = false }
    shadowBundle(libs.sqlite.jdbc) { transitive = false }
    shadowBundle(libs.log4j.jul) { transitive = false }

    // Maven Resolver (Aether) is required by CraftBukkit's JavaPluginLoader to resolve
    // plugin.yml "libraries". Same coordinates the legacy launcher shipped as server libs.
    for (dep in ['org.apache.maven:maven-resolver-provider:3.8.5',
     'org.apache.maven.resolver:maven-resolver-connector-basic:1.7.3',
     'org.apache.maven.resolver:maven-resolver-transport-http:1.7.3',
     'org.apache.maven:maven-model:3.8.5',
     'org.apache.maven:maven-model-builder:3.8.5',
     'org.apache.maven:maven-builder-support:3.8.5',
     'org.apache.maven:maven-repository-metadata:3.8.5',
     'org.apache.maven.resolver:maven-resolver-api:1.6.3',
     'org.apache.maven.resolver:maven-resolver-spi:1.6.3',
     'org.apache.maven.resolver:maven-resolver-util:1.6.3',
     'org.apache.maven.resolver:maven-resolver-impl:1.6.3',
     'org.codehaus.plexus:plexus-interpolation:1.26',
     'org.eclipse.sisu:org.eclipse.sisu.inject:0.3.4',
     'org.apache.httpcomponents:httpclient:4.5.13',
     'org.apache.httpcomponents:httpcore:4.4.14',
     'commons-codec:commons-codec:1.15',
     'org.slf4j:jcl-over-slf4j:1.7.30',
     'javax.inject:javax.inject:1'
    ]) {
        shadowBundle(dep) { transitive = false }
    }

    implementation(libs.bundles.spigot.shade) { transitive = false }
    shadowBundle(libs.bundles.spigot.shade) { transitive = false }
    implementation rootProject.ext.generatedSpigot
    shadowBundle(rootProject.ext.generatedSpigot) { transitive = false }

    // XXX: for compiling (arclight-api): NeoForgeArclightServer#registerForgeEvent
    compileOnly("net.minecraftforge:eventbus:4.0.0") { transitive = false }

    implementation(project(':i18n-config')) { transitive = false }

    implementation(libs.bundles.adventure) {
        exclude group: 'org.slf4j'
        exclude group: 'org.checkerframework'
        exclude group: 'com.google.code.gson'
    }
    shadowBundle(libs.bundles.adventure) {
        exclude group: 'org.slf4j'
        exclude group: 'org.checkerframework'
        exclude group: 'com.google.code.gson'
    }
    common(project(path: ':arclight-common', configuration: 'namedElements')) { transitive = false }
    shadowBundle(project(path: ':arclight-common', configuration: 'transformProductionNeoForge')) { transitive = false }
}

tasks.register('neoforgeMappings', Copy) {
    destinationDir = file('build/neoforge_mappings')
    from(arclight.mappingsConfiguration.bukkitToNeoForge) {
        rename { name -> 'bukkit_srg.srg' }
    }
    from(arclight.mappingsConfiguration.bukkitToNeoForge) {
        rename { name -> 'bukkit_moj.srg'}
    }
    from arclight.mappingsConfiguration.bukkitToForgeInheritance
}

project.sourceSets.main.output.dir file('build/neoforge_mappings'), builtBy: tasks.neoforgeMappings

processResources {
    def ver = "${project.version}+$gitHash"
    inputs.property 'version', ver

    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': ver
    }

    filesMatching('META-INF/luminara-version.properties') {
        expand minecraftVersion: libs.versions.minecraft.get(), loader: 'NeoForge',
            loaderVersion: libs.versions.neoforge.get(), javaVersion: '21',
            bukkitPackage: libs.versions.bukkit.api.get(), version: ver, gitCommit: gitHash
    }
}

def bundleJarJarLibraries = tasks.register('bundleJarJarLibraries', BundleJarJarTask) {
    libraries.from configurations.jarJarBundle
    libraryCoordinates.set configurations.jarJarBundle.incoming.artifacts.resolvedArtifacts.map { artifacts ->
        artifacts.collectEntries { artifact ->
            def id = artifact.id.componentIdentifier
            [(artifact.file.name): "$id.group:$id.module:$id.version".toString()]
        }
    }
    // Keep the range open ended and above the SnakeYAML 2 rewrite: CraftBukkit needs the
    // LoaderOptions API, and a mod shipping a newer 2.x copy has to be able to win.
    versionRanges.put 'org.yaml:snakeyaml', '[2.0,)'
    outputDirectory.set layout.buildDirectory.dir('jarjar')
}

// The shadow and remap stages merge every archive they are handed, so the nested libraries are
// appended by the distribution assembly instead.
rootProject.tasks.named('assembleNeoForgeModDistribution', AssembleDistributionTask).configure {
    nestedLibraries.set bundleJarJarLibraries.flatMap { it.outputDirectory }
}

shadowJar {
    exclude 'fabric.mod.json'
    exclude 'architectury.common.json'
    exclude 'com/google/**'
    exclude 'org/checkerframework/**'
    // The NeoForge game layer exposes org.apache.maven.artifact as the maven.artifact
    // module; bundling it would split its packages. The module is read by the mod.
    exclude 'org/apache/maven/artifact/**'

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    atAccessWideners.add(loom.accessWidenerPath.get().asFile.getName())
}

tasks.register('srgJar', Jar) {
    from(tasks.remapJar.outputs.files.collect { it.isDirectory() ? it : zipTree(it) }) {
        include 'io/izzel/**'
        exclude 'io/izzel/arclight/common/mixin/**'
        exclude 'io/izzel/arclight/forge/mixin/**'
    }
    archiveClassifier.set('srg')
    dependsOn remapJar
}

sourcesJar {
    def commonSources = rootProject.ext.commonProject.sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

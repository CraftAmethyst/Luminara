plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}
repositories {
    maven {
        url = 'https://maven.minecraftforge.net'
        content { includeGroup 'net.minecraftforge' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    implementation project(":common")
    implementation files(project(':common').file('libs/spigot-1.20.1-mapped-deobf.jar'))
    compileOnly("net.minecraftforge:eventbus:4.0.0") { transitive = false }
}

repositories {
    maven {
        name = 'Izzel'
        url = 'https://maven.izzel.io/releases'
        content {
            includeGroupByRegex 'io\\.izzel(\\..*)?'
            includeGroup 'net.md-5'
        }
    }
    maven {
        name = 'ForgeMaven'
        url = 'https://maven.minecraftforge.net'
        content { includeGroup 'net.minecraftforge' }
    }
    maven {
        name = 'JitPack'
        url = 'https://jitpack.io'
        content { includeGroupByRegex 'com\\.github\\.ArclightTeam(\\..*)?' }
    }
    ivy {
        name = 'SpigotPinnedSnapshot'
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots'
        patternLayout {
            artifact '[organisation]/[module]/1.20.1-R0.1-SNAPSHOT/[module]-[revision](-[classifier]).[ext]'
            setM2compatible(true)
        }
        metadataSources { artifact() }
        content { includeGroupByRegex 'org\\.spigotmc(\\..*)?' }
    }
}

loom {
    if (project(":common").file("src/main/resources/${mod_id}.accesswidener").exists()) {
        accessWidenerPath.set(project(":common").file("src/main/resources/${mod_id}.accesswidener"))
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

tasks.named('validateAccessWidener') {
    enabled = false
}

jar {
    from({ zipTree(project(':common').file('libs/spigot-1.20.1-mapped-deobf.jar')) }) {
        include 'org/bukkit/craftbukkit/**'
        include 'org/spigotmc/**'
    }
}

name: CI

on:
  pull_request:
  push:
    branches:
      - stable/Trials
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux verification
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Java 17
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947
      - name: Full verification including the native Forge smoke test
        run: ./gradlew verify
      - name: Upload verification artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: luminara-verification-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            build/distributions/luminara-*.jar
            build/distributions/luminara-*.jar.sha256
            **/build/test-results/**
            **/build/reports/tests/**

  windows:
    name: Windows assembly and mod JAR contract
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Java 17
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947
      - name: Verify and assemble the standard Forge mod
        run: .\gradlew.bat check assembleForgeMod verifyForgeModDistribution
      - name: Check the mod JAR is a standard mod and carries no launcher
        shell: pwsh
        run: |
          $jars = @(Get-ChildItem 'build/distributions' -Filter 'luminara-forge-*.jar' -File)
          if ($jars.Count -ne 1) {
            throw "Expected exactly one Luminara mod JAR, found $($jars.Count): $($jars.FullName -join ', ')"
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($jars[0].FullName)
          try {
            $names = $archive.Entries | ForEach-Object { $_.FullName }
            foreach ($required in @('META-INF/mods.toml', 'META-INF/MANIFEST.MF', 'mixins.arclight.refmap.json')) {
              if ($names -notcontains $required) { throw "Missing $required" }
            }
            foreach ($forbidden in @('common.jar', 'gson.jar', 'META-INF/installer.json', 'META-INF/services/net.minecraftforge.forgespi.locating.IModLocator')) {
              if ($names -contains $forbidden) { throw "Legacy launcher entry still present: $forbidden" }
            }
            $launcherClasses = @($names | Where-Object { $_ -like 'io/izzel/arclight/boot/*' -or $_ -like 'io/izzel/arclight/server/*' -or $_ -like 'io/izzel/arclight/forgeinstaller/*' })
            if ($launcherClasses.Count -gt 0) {
              throw "Legacy launcher classes still present: $($launcherClasses -join ', ')"
            }
            $manifest = New-Object System.IO.StreamReader($archive.GetEntry('META-INF/MANIFEST.MF').Open())
            $text = $manifest.ReadToEnd()
            $manifest.Close()
            if ($text -match 'Main-Class') { throw 'The mod JAR must not declare a Main-Class launcher entry' }
          } finally {
            $archive.Dispose()
          }

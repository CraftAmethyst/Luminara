name: CI

on:
  pull_request:
  push:
    branches:
      - stable/Trials
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux build and artifact verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Java 17
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947
      - name: Build and verify both loaders
        timeout-minutes: 35
        run: ./gradlew check assembleForgeMod assembleFabricMod
      - name: Upload verification artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: luminara-verification-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            build/distributions/luminara-*.jar
            build/distributions/luminara-*.jar.sha256
            **/build/test-results/**
            **/build/reports/tests/**

  smoke-forge:
    name: Forge dedicated-server startup smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Java 17
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947
      - name: Start the Forge development server and verify startup
        timeout-minutes: 25
        run: |
          mkdir -p build forge/run/config
          printf 'eula=true\n' > forge/run/eula.txt
          printf 'online-mode=false\nlevel-type=flat\nmax-players=1\n' > forge/run/server.properties
          printf '[server]\n    advertiseDedicatedServerToLan = false\n' > forge/run/config/forge-server.toml
          timeout 900 ./gradlew :forge:runServer --no-daemon --console=plain > build/forge-smoke.log 2>&1 || true
          grep -q 'Luminara 2.0.0' build/forge-smoke.log
          grep -q 'Done (' build/forge-smoke.log
      - name: Upload Forge smoke log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: luminara-forge-smoke-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: build/forge-smoke.log

  smoke-fabric:
    name: Fabric dedicated-server startup smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Java 17
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947
      - name: Start the Fabric development server and verify startup
        timeout-minutes: 25
        run: |
          mkdir -p build fabric/run
          printf 'eula=true\n' > fabric/run/eula.txt
          printf 'online-mode=false\nlevel-type=flat\nmax-players=1\n' > fabric/run/server.properties
          timeout 900 ./gradlew :fabric:runServer --no-daemon --console=plain > build/fabric-smoke.log 2>&1 || true
          grep -q 'Luminara 2.0.0' build/fabric-smoke.log
          grep -q 'Done (' build/fabric-smoke.log
      - name: Upload Fabric smoke log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: luminara-fabric-smoke-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: build/fabric-smoke.log

  windows:
    name: Windows assembly and mod JAR contracts
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Java 17
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947
      - name: Verify and assemble both loader distributions
        timeout-minutes: 25
        run: .\gradlew.bat check assembleForgeMod assembleFabricMod
      - name: Check both mod JARs declare their loader metadata
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $forge = Get-ChildItem 'build/distributions' -Filter 'luminara-forge-*.jar' -File
          $fabric = Get-ChildItem 'build/distributions' -Filter 'luminara-fabric-*.jar' -File
          if ($forge.Count -ne 1) { throw "Expected one Forge JAR, found $($forge.Count)" }
          if ($fabric.Count -ne 1) { throw "Expected one Fabric JAR, found $($fabric.Count)" }
          function Get-Names($path) {
            $archive = [System.IO.Compression.ZipFile]::OpenRead($path)
            try { return $archive.Entries | ForEach-Object { $_.FullName } }
            finally { $archive.Dispose() }
          }
          $forgeNames = Get-Names $forge[0].FullName
          foreach ($required in @('META-INF/mods.toml', 'META-INF/MANIFEST.MF', 'mixins.arclight.refmap.json', 'org/craftamethyst/luminara/common/mod/ArclightMod.class')) {
            if ($forgeNames -notcontains $required) { throw "Forge JAR missing $required" }
          }
          $fabricNames = Get-Names $fabric[0].FullName
          foreach ($required in @('fabric.mod.json', 'mixins.arclight.core.fabric.json', 'org/craftamethyst/luminara/fabric/LuminaraFabric.class')) {
            if ($fabricNames -notcontains $required) { throw "Fabric JAR missing $required" }
          }
          if ($fabricNames -contains 'META-INF/mods.toml') { throw 'Fabric JAR must not contain Forge metadata' }

name: CI

on:
  pull_request:
  push:
    branches:
      - stable/FeudalKings
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Java 21
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947
      - name: Grant execute permission for Gradle
        run: chmod +x gradlew
      - name: Verify and collect
        run: ./gradlew check verifyDistributions verifyLauncherBoundaries collect --stacktrace
      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: luminara-linux-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/distributions/luminara-*.jar
            **/build/test-results/**
            **/build/reports/tests/**
            build/launcher-boundary/**

  windows:
    name: Windows verification
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Java 21
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947
      - name: Verify and collect
        run: .\gradlew.bat check verifyDistributions verifyLauncherBoundaries collect --stacktrace
      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: luminara-windows-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/distributions/luminara-*.jar
            **/build/test-results/**
            **/build/reports/tests/**
            build/launcher-boundary/**

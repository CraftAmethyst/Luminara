name: Pull Request Check

on:
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew clean check collect --no-daemon --stacktrace

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Luminara-PR-${{ github.event.pull_request.number }}
          path: build/libs/luminara-*.jar
          if-no-files-found: error

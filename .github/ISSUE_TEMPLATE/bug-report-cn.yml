name: 错误报告
description: 报告在受支持运行环境中可复现的 Luminara 缺陷
title: "[错误]: "
labels:
  - Triage

body:
  - type: markdown
    attributes:
      value: |
        请使用 `CraftAmethyst/Luminara` 的 `stable/Trials` 分支构建。
        受支持的版本为 Luminara `1.0.14`、Minecraft `1.20.1`、该 Minecraft 版本的最新 Forge promotion 和 64 位 Java 17。
        提交前请搜索现有问题。除非问题也能在 Arclight 中复现，否则请勿向上游 Arclight 报告 Luminara 缺陷。

  - type: checkboxes
    id: prerequisites
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Luminara 问题，未发现重复报告。
          required: true
        - label: 我已在 Minecraft `1.20.1`、最新 Forge promotion、Java 17 和 `stable/Trials` 分支构建中复现此问题。
          required: true
        - label: 我已移除无关 Mod 和插件，并找到了仍会失败的最小组合。
          required: true
        - label: 我已从报告中删除凭据、地址、玩家数据及其他隐私信息。
          required: true

  - type: input
    id: luminara-version
    attributes:
      label: Luminara 版本和提交
      description: 请从 `/luminara info` 或启动输出中复制 Luminara 版本和构建提交。
      placeholder: "Luminara 1.0.14，提交 1a2b3c4"
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: 运行环境
      description: 请包含操作系统、架构、Java、Minecraft 和 Forge 的版本。
      placeholder: "Ubuntu 24.04 x86_64；Temurin 17.0.x；Minecraft 1.20.1；latest Forge promotion"
    validations:
      required: true

  - type: textarea
    id: mods-plugins
    attributes:
      label: 最小 Mod 和插件组合
      description: 列出复现所需的每个 Mod、插件及其精确版本；不需要时填写“无”。
      placeholder: |
        Mod：
        - example-mod 1.2.3
        插件：
        - ExamplePlugin 4.5.6
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 说明预期看到的可观察结果。
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 说明实际发生的情况，包括发生时机和频率。
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 使用上述最小组合，提供从全新服务器开始的逐步复现方法。
      placeholder: |
        1. 创建全新的 Luminara 服务器。
        2. 安装列出的 Mod 或插件版本。
        3. 启动服务器并执行……
        4. 观察到……
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志和崩溃报告
      description: 请附上完整的 `logs/latest.log` 和相关崩溃报告，不要只粘贴最后一段异常。
      placeholder: 将文件拖到此处，或提供指向完整日志的稳定链接。
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: 其他信息
      description: 如已在 Forge、Spigot 或 Arclight 中进行对比测试，请附上结果。
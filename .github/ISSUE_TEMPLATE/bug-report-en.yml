name: Bug report
description: Report a reproducible Luminara defect on the supported runtime
title: "[Bug]: "
labels:
  - Triage

body:
  - type: markdown
    attributes:
      value: |
        Use a build from the `stable/Trials` branch of `CraftAmethyst/Luminara`.
        The supported matrix is Luminara `1.0.14`, Minecraft `1.20.1`, the latest Forge promotion for that Minecraft version, and 64-bit Java 17.
        Search existing issues first. Do not report Luminara defects to upstream Arclight unless they also reproduce there.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I searched existing Luminara issues and found no duplicate.
          required: true
        - label: I reproduced this on `stable/Trials` with Minecraft `1.20.1`, the latest Forge promotion, and Java 17.
          required: true
        - label: I removed unrelated mods and plugins and identified the smallest failing set.
          required: true
        - label: I removed credentials, addresses, player data, and other private information from this report.
          required: true

  - type: input
    id: luminara-version
    attributes:
      label: Luminara version and commit
      description: Copy the Luminara version and build commit from `/luminara info` or startup output.
      placeholder: "Luminara 1.0.14, commit 1a2b3c4"
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: Runtime environment
      description: Include the operating system, architecture, Java version, Minecraft version, and Forge version.
      placeholder: "Ubuntu 24.04 x86_64; Temurin 17.0.x; Minecraft 1.20.1; latest Forge promotion"
    validations:
      required: true

  - type: textarea
    id: mods-plugins
    attributes:
      label: Minimal mod and plugin set
      description: List each required mod and plugin with its exact version. Write `none` when the minimal reproduction uses none.
      placeholder: |
        Mods:
        - example-mod 1.2.3
        Plugins:
        - ExamplePlugin 4.5.6
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: State the observable result you expected.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: State what happened instead, including timing and frequency.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide a fresh-server, step-by-step reproduction using the minimal set above.
      placeholder: |
        1. Create a new Luminara server.
        2. Install the listed mod or plugin versions.
        3. Start the server and run ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and crash reports
      description: Attach the complete `logs/latest.log` and relevant crash report. Do not paste only the final exception.
      placeholder: Drag files here or provide stable links to the complete logs.
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Include upstream Forge, Spigot, or Arclight comparison results when available.

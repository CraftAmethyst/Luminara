import groovy.json.JsonSlurper
import java.security.MessageDigest
import org.gradle.api.artifacts.dsl.LockMode
import io.izzel.arclight.gradle.tasks.SmokeServerTask
import io.izzel.arclight.gradle.tasks.VerifyForgeModTask
import io.izzel.arclight.gradle.tasks.VerifyReproducibleBuildTask

def resolveForgeVersion = {
    def override = providers.gradleProperty('forgeVersion').orNull
    if (override != null && !override.isBlank()) return override

    def minecraftVersion = libs.versions.minecraft.get()
    def connection = URI.create('https://files.minecraftforge.net/net/minecraftforge/forge/promotions_slim.json').toURL().openConnection()
    connection.connectTimeout = 10000
    connection.readTimeout = 10000
    def promotions
    connection.inputStream.withCloseable { input ->
        promotions = new JsonSlurper().parse(input)
    }
    def latest = promotions.promos["${minecraftVersion}-latest"]
    if (!(latest instanceof String) || !(latest ==~ /\d+(?:\.\d+)+/)) {
        throw new GradleException("Forge promotions has no valid latest version for Minecraft ${minecraftVersion}")
    }
    return latest
}

def resolvedForgeVersion = resolveForgeVersion()

allprojects {
    group 'io.izzel.luminara'
    version libs.versions.project.get()

    def getGitHash = { ->
        def providedHash = providers.gradleProperty('luminaraGitHash').orNull
        if (providedHash != null) {
            if (!(providedHash ==~ /[0-9a-f]{7,40}/)) {
                throw new GradleException('luminaraGitHash must be a 7-40 character lowercase hexadecimal commit hash')
            }
            return providedHash
        }
        def stdout = new ByteArrayOutputStream()
        try {
            exec {
                commandLine 'git', 'rev-parse', '--short', 'HEAD'
                standardOutput = stdout
            }
        } catch (Exception ignored) {
            return 'unknown'
        }
        return stdout.toString().trim()
    }

    ext {
        agpVersion = libs.versions.arclight.gradle.plugin.get()
        minecraftVersion = libs.versions.minecraft.get()
        forgeVersion = resolvedForgeVersion
        apiVersion = libs.versions.arclight.api.get()
        toolsVersion = libs.versions.tools.get()
        mixinVersion = libs.versions.mixin.runtime.get()
        versionName = 'trials'
        gitHash = getGitHash()
    }

    dependencyLocking {
        // ForgeGradle's Minecraft graph is OS-specific (for example, Netty epoll is Linux-only).
        // Keep locked versions as constraints without requiring every platform's optional modules.
        lockMode = LockMode.LENIENT
        lockAllConfigurations()
    }

    configurations.configureEach {
        if (name.startsWith('art_rev_')) {
            resolutionStrategy.deactivateDependencyLocking()
        }
    }
}

def modJarName = "luminara-forge-${libs.versions.minecraft.get()}-${libs.versions.project.get()}.jar"
def modOutputJar = layout.buildDirectory.file("distributions/${modJarName}")
def modChecksum = layout.buildDirectory.file("distributions/${modJarName}.sha256")
def modInput = configurations.create('modInput') {
    canBeConsumed = false
    canBeResolved = true
    transitive = false
}
dependencies.add('modInput', dependencies.project(path: ':arclight-forge', configuration: 'archives'))

def assembleForgeMod = tasks.register('assembleForgeMod') {
    group = 'build'
    description = 'Assembles the standard Luminara Forge mod JAR and its checksum.'
    inputs.files(modInput)
    outputs.files(modOutputJar, modChecksum)

    doLast {
        if (project.ext.gitHash == 'unknown') {
            throw new GradleException('assembleForgeMod requires Git commit metadata')
        }
        copy {
            from(modInput.singleFile)
            into(modOutputJar.get().asFile.parentFile)
            rename { modJarName }
        }
        def jarFile = modOutputJar.get().asFile
        MessageDigest digest = MessageDigest.getInstance('SHA-256')
        jarFile.eachByte(8192) { bytes, size -> digest.update(bytes, 0, size) }
        modChecksum.get().asFile.text = digest.digest().collect { String.format('%02x', it) }.join() + "  ${modJarName}\n"
    }
}

tasks.register('verifyForgeModDistribution', VerifyForgeModTask) {
    group = 'verification'
    description = 'Validates that the artifact is a standard Forge mod JAR with no legacy launcher entries.'
    dependsOn(assembleForgeMod)
    modJar.set(modOutputJar)
    modId.set('luminara')
    minecraftVersion.set(libs.versions.minecraft.get())
    forgeVersion.set(project.ext.forgeVersion)
    expectedVersionPrefix.set(libs.versions.project.get())
    requiredEntries.set([
            'META-INF/mods.toml',
            'META-INF/accesstransformer.cfg',
            'META-INF/luminara-version.properties',
            'META-INF/MANIFEST.MF',
            'mixins.arclight.refmap.json',
            'pack.mcmeta',
            'io/izzel/arclight/common/mod/ArclightMod.class',
            'io/izzel/arclight/common/mod/ArclightConnector.class',
            'io/izzel/arclight/common/mixin/core/commands/CommandNodeMixin.class',
            'io/izzel/arclight/common/mixin/bukkit/enumvalues/MaterialEnumMixin.class'
    ])
    mixinConfigurations.set([
            'mixins.arclight.core.json',
            'mixins.arclight.bukkit.json',
            'mixins.arclight.forge.json',
            'mixins.arclight.compat.json',
            'mixins.arclight.impl.forge.optimization.json'
    ])
    expectedManifestAttributes.set([
            'MixinConnector': 'io.izzel.arclight.common.mod.ArclightConnector'
    ])
}

def forgeInstallerFile = project(':arclight-common').layout.buildDirectory.file(
        "arclight_cache/forge-${project.ext.minecraftVersion}-${project.ext.forgeVersion}-installer.jar")

def smokeServer = tasks.register('smokeServer', SmokeServerTask) {
    group = 'verification'
    outputs.upToDateWhen { false }
    description = 'Installs a clean Forge dedicated server, runs the mod with the smoke fixtures, and asserts on the log.'
    dependsOn(assembleForgeMod, ':arclight-common:smokePluginJar', ':arclight-common:smokeModJar',
            ':arclight-common:downloadInstaller')
    modJar.set(modOutputJar)
    pluginJar.set(project(':arclight-common').tasks.named('smokePluginJar', Jar).flatMap { it.archiveFile })
    fixtureModJar.set(project(':arclight-common').tasks.named('smokeModJar', Jar).flatMap { it.archiveFile })
    forgeInstallerJar.set(forgeInstallerFile)
    forgeCoordinates.set("${project.ext.minecraftVersion}-${project.ext.forgeVersion}")
    fixtureDirectory.set(layout.buildDirectory.dir('smoke-server'))
    startupTimeoutSeconds.set(900)
    expectedOutput.set([
            'Done (',
            'For help, type "help"',
            'LUMINARA_SMOKE_MOD_ENABLED',
            'LUMINARA_SMOKE_PLUGIN_ENABLED',
            'LUMINARA_SMOKE_BUKKIT_API_OK',
            'LUMINARA_SMOKE_ENUM_DEFINALIZED Material=Material',
            'LUMINARA_SMOKE_ENUM_DEFINALIZED SpawnCategory=SpawnCategory',
            'LUMINARA_SMOKE_COMMAND_OK',
            'Luminara Version: ',
            project.version.toString(),
            project.ext.gitHash,
            'Minecraft / Forge / Java: ',
            "${project.ext.minecraftVersion} / ${project.ext.forgeVersion} / ${libs.versions.java.get()}",
            'CraftBukkit Package: ',
            'v1_20_R1'
    ])
}

tasks.register('smokeNativeForgeServer') {
    group = 'verification'
    description = 'Alias for smokeServer, the native Forge dedicated-server smoke test.'
    dependsOn(smokeServer)
}

tasks.register('runNativeForgeServer') {
    group = 'verification'
    description = 'Alias for smokeServer that keeps the fixture server directory for manual inspection.'
    dependsOn(smokeServer)
}

// Every other gate is a static inspection of the artifact; this one actually boots Forge
// with the mod in mods/ and a Bukkit plugin in plugins/. The root project has no check
// task of its own, so the full gate is exposed as verify and wired into the module checks.
tasks.register('verify') {
    group = 'verification'
    description = 'Runs every module check plus the mod JAR verification and the native Forge smoke test.'
    dependsOn(subprojects.collect { it.tasks.matching { task -> task.name == 'check' } })
    dependsOn(tasks.named('verifyForgeModDistribution'), smokeServer)
}

def reproducibleWorkspace = new File(System.getProperty('java.io.tmpdir'),
        "luminara-reproducible-${Integer.toUnsignedString(rootDir.absolutePath.hashCode())}")

tasks.register('verifyReproducibleForgeMod', VerifyReproducibleBuildTask) {
    group = 'verification'
    description = 'Builds the tracked source twice and compares the Forge mod JAR entry by entry.'
    sourceDirectory.set(layout.projectDirectory)
    workspaceDirectory.set(reproducibleWorkspace)
    distributionRelativePath.set("build/distributions/${modJarName}")
    // Spigot's BuildTools remapper emits two constant pool class entries in a run-dependent
    // order for this one class, so it differs by four bytes between builds. Every other
    // entry still has to match byte for byte, and a real change to this class changes many
    // more bytes than the allowance.
    knownVariance.set([
            'org/bukkit/craftbukkit/v/scoreboard/CraftScoreboard.class': 8
    ])
}

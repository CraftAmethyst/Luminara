import java.security.MessageDigest
import io.izzel.arclight.gradle.tasks.SmokeServerTask
import io.izzel.arclight.gradle.tasks.VerifyDistributionTask
import io.izzel.arclight.gradle.tasks.UploadFilesTask

allprojects {
    group 'io.izzel.luminara'
    version libs.versions.project.get()

    def getGitHash = { ->
        def stdout = new ByteArrayOutputStream()
        try {
            exec {
                commandLine 'git', 'rev-parse', '--short', 'HEAD'
                standardOutput = stdout
            }
        } catch (Exception ignored) {
            return 'unknown'
        }
        return stdout.toString().trim()
    }

    ext {
        agpVersion = libs.versions.arclight.gradle.plugin.get()
        minecraftVersion = libs.versions.minecraft.get()
        forgeVersion = libs.versions.forge.get()
        apiVersion = libs.versions.arclight.api.get()
        toolsVersion = libs.versions.tools.get()
        mixinVersion = libs.versions.mixin.runtime.get()
        versionName = 'trials'
        gitHash = getGitHash()
    }

    dependencyLocking {
        lockAllConfigurations()
    }

    configurations.configureEach {
        if (name.startsWith('art_rev_')) {
            resolutionStrategy.deactivateDependencyLocking()
        }
    }
}

def distributionName = "luminara-${libs.versions.minecraft.get()}-${libs.versions.project.get()}.jar"
def distributionOutputJar = layout.buildDirectory.file("distributions/${distributionName}")
def distributionChecksum = layout.buildDirectory.file("distributions/${distributionName}.sha256")
def distributionInput = configurations.create('distributionInput') {
    canBeConsumed = false
    canBeResolved = true
    transitive = false
}
dependencies.add('distributionInput', dependencies.project(path: ':arclight-forge', configuration: 'archives'))

def assembleDistribution = tasks.register('assembleDistribution') {
    group = 'build'
    description = 'Assembles the reproducible Luminara server distribution.'
    inputs.files(distributionInput)
    outputs.files(distributionOutputJar, distributionChecksum)

    doLast {
        if (project.ext.gitHash == 'unknown') {
            throw new GradleException('assembleDistribution requires Git commit metadata')
        }
        copy {
            from(distributionInput.singleFile)
            into(distributionOutputJar.get().asFile.parentFile)
            rename { distributionName }
        }
        def jarFile = distributionOutputJar.get().asFile
        MessageDigest digest = MessageDigest.getInstance('SHA-256')
        jarFile.eachByte(8192) { bytes, size -> digest.update(bytes, 0, size) }
        distributionChecksum.get().asFile.text = digest.digest().collect { String.format('%02x', it) }.join() + "  ${distributionName}\n"
    }
}

tasks.register('verifyDistribution', VerifyDistributionTask) {
    group = 'verification'
    description = 'Validates the assembled Luminara distribution contract.'
    dependsOn(assembleDistribution)
    distributionJar.set(distributionOutputJar)
    forgeInstallerJar.set(project(':arclight-common').layout.buildDirectory.file("arclight_cache/forge-${libs.versions.minecraft.get()}-${libs.versions.forge.get()}-installer.jar"))
    minecraftVersion.set(libs.versions.minecraft.get())
    forgeVersion.set(libs.versions.forge.get())
    mainClass.set('io.izzel.arclight.server.Launcher')
    requiredEntries.set([
            'common.jar',
            'gson.jar',
            'META-INF/installer.json',
            'META-INF/luminara-version.properties'
    ])
    requiredCommonEntries.set([
            'mixins.arclight.core.json',
            'mixins.arclight.bukkit.json',
            'mixins.arclight.forge.json',
            'mixins.arclight.compat.json',
            'mixins.arclight.impl.forge.optimization.json'
    ])
    expectedServices.set([
            'java.util.function.Consumer': 'io.izzel.arclight.boot.application.ApplicationBootstrap',
            'net.minecraftforge.forgespi.locating.IModLocator': 'io.izzel.arclight.boot.mod.ArclightLocator_Forge',
            'cpw.mods.modlauncher.serviceapi.ILaunchPluginService': 'io.izzel.arclight.boot.asm.ArclightImplementer',
            'cpw.mods.modlauncher.api.ILaunchHandlerService': 'io.izzel.arclight.boot.application.ArclightLaunchHandler'
    ])
}

tasks.register('smokeServer', SmokeServerTask) {
    group = 'verification'
    outputs.upToDateWhen { false }
    description = 'Starts an isolated Forge server with smoke mod and plugin fixtures.'
    dependsOn(assembleDistribution, ':arclight-common:smokePluginJar', ':arclight-common:smokeModJar')
    distributionJar.set(distributionOutputJar)
    pluginJar.set(project(':arclight-common').tasks.named('smokePluginJar', Jar).flatMap { it.archiveFile })
    modJar.set(project(':arclight-common').tasks.named('smokeModJar', Jar).flatMap { it.archiveFile })
    fixtureDirectory.set(layout.buildDirectory.dir('smoke-server'))
    startupTimeoutSeconds.set(900)
    expectedOutput.set([
            'Done (',
            'For help, type "help"',
            'LUMINARA_SMOKE_MOD_ENABLED',
            'LUMINARA_SMOKE_PLUGIN_ENABLED',
            'LUMINARA_SMOKE_COMMAND_OK',
            'Luminara Version: ',
            '1.0.14',
            project.ext.gitHash,
            'Minecraft / Forge / Java: ',
            '1.20.1 / 47.4.22 / 17',
            'CraftBukkit Package: ',
            'v1_20_R1'
    ])
}

def gitBranch() {
    def stdout = new ByteArrayOutputStream()
    exec {
        commandLine 'git', 'rev-parse', '--abbrev-ref', 'HEAD'
        standardOutput = stdout
    }
    return stdout.toString().trim()
}

tasks.register('uploadFiles', UploadFilesTask) {
    mcVersion.set project.ext.minecraftVersion
    version.set "${project.version}-${project.ext.gitHash}"
    snapshot.set project.version.toString().endsWith("-SNAPSHOT")
    gitHash.set project.ext.gitHash
    branch.set gitBranch()
    inputs.files assembleDistribution.map { it.outputs.files }
    dependsOn(assembleDistribution)
}

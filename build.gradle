buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public' }
        mavenCentral()
        maven { url = 'https://maven.izzel.io/releases' }
    }
    dependencies {
        classpath 'io.izzel.arclight:arclight-gradle-plugin:1.23'
    }
}

plugins {
    id 'fabric-loom' version '1.9-SNAPSHOT' apply(false)
    id 'net.neoforged.moddev.legacyforge' version '2.0.77' apply(false)
}

allprojects {
    group = 'org.craftamethyst.luminara'
    version = providers.gradleProperty('version').get()

    def gitHashProvider = providers.provider {
        def override = providers.gradleProperty('luminaraGitHash').orNull
        if (override != null && !override.isBlank()) {
            return override
        }
        def stdout = new ByteArrayOutputStream()
        try {
            exec {
                commandLine 'git', 'rev-parse', '--short', 'HEAD'
                standardOutput = stdout
            }
        } catch (Exception ignored) {
            return 'unknown'
        }
        return stdout.toString().trim()
    }

    ext {
        minecraftVersion = providers.gradleProperty('minecraft_version').get()
        forgeVersion = providers.gradleProperty('forge_version').get()
        fabricLoaderVersion = providers.gradleProperty('fabric_loader_version').get()
        fabricApiVersion = providers.gradleProperty('fabric_version').get()
        gitHash = gitHashProvider.get()
    }
}

// ---------------------------------------------------------------------------
// Spigot compatibility layer generation
//
// The compiled common code needs CraftBukkit classes whose Minecraft members
// are named with Mojang mappings. Building those classes is expensive, so a
// verified artifact is checked in under common/libs. This task regenerates it
// from Spigot's BuildTools and the Arclight mapping tasks when requested with
// -PregenerateSpigotMappedJar.
// ---------------------------------------------------------------------------
def spigotWorkDir = layout.buildDirectory.dir('spigot')
def spigotBuildToolsDir = layout.buildDirectory.dir('spigot/buildtools')
def spigotJar = spigotBuildToolsDir.map { it.file('spigot-1.20.1.jar') }
def buildToolsJar = spigotWorkDir.map { it.file('BuildTools.jar') }
def spigotMappingDir = spigotWorkDir.map { it.dir('tmp_srg') }
def mappedSpigotJar = layout.projectDirectory.file('common/libs/spigot-1.20.1-mapped-deobf.jar')
def versionJson = spigotWorkDir.map { it.file('version.json') }

tasks.register('downloadSpigotBuildTools') {
    group = 'spigot'
    description = 'Downloads the Spigot BuildTools launcher.'
    outputs.file(buildToolsJar)
    doLast {
        def target = buildToolsJar.get().asFile
        target.parentFile.mkdirs()
        new URL('https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar')
            .withInputStream { input -> target.withOutputStream { it << input } }
    }
}

tasks.register('downloadMinecraftVersionJson') {
    group = 'spigot'
    outputs.file(versionJson)
    doLast {
        def manifest = new groovy.json.JsonSlurper().parse(new URL('https://piston-meta.mojang.com/mc/game/version_manifest_v2.json'))
        def entry = manifest.versions.find { it.id == minecraftVersion }
        if (entry == null) {
            throw new GradleException("No Minecraft version metadata for ${minecraftVersion}")
        }
        def target = versionJson.get().asFile
        target.parentFile.mkdirs()
        new URL(entry.url).withInputStream { input -> target.withOutputStream { it << input } }
    }
}

tasks.register('buildSpigotServer') {
    group = 'spigot'
    description = 'Runs BuildTools for the supported Minecraft version.'
    dependsOn('downloadSpigotBuildTools')
    outputs.file(spigotJar)
    doLast {
        def dir = spigotBuildToolsDir.get().asFile
        dir.mkdirs()
        exec {
            workingDir dir
            commandLine "${System.getProperty('java.home')}/bin/java", '-jar',
                    buildToolsJar.get().asFile.absolutePath, '--rev', minecraftVersion, '--compile', 'spigot'
        }
    }
}

def processSpigotMapping = tasks.register('processSpigotMapping', io.izzel.arclight.gradle.tasks.ProcessMappingV2Task) {
    group = 'spigot'
    description = 'Builds the Bukkit-to-SRG mapping used by the Spigot remapper.'
    dependsOn('buildSpigotServer', 'downloadMinecraftVersionJson', ':common:createMinecraftArtifacts')
    buildData = spigotBuildToolsDir.get().dir('BuildData').asFile
    mcVersion = minecraftVersion
    bukkitVersion = 'v1_20_R1'
    outDir = spigotMappingDir.get().asFile
    inMeta = versionJson.get().asFile
    inSrg = project(':common').layout.buildDirectory.file('moddev/artifacts/namedToIntermediate.tsrg').get().asFile
    inMcp = project(':common').layout.buildDirectory.file('moddev/artifacts/intermediateToNamed.srg').get().asFile
    inJar = spigotJar.get().asFile
    inVanillaJar = project(':common').layout.buildDirectory.file('moddev/artifacts/vanilla-1.20.1.jar').get().asFile
    packageName = 'v'
}

tasks.register('remapSpigotJar', io.izzel.arclight.gradle.tasks.RemapSpigotTask) {
    group = 'spigot'
    description = 'Remaps Spigot CraftBukkit classes to Mojang names for compilation.'
    dependsOn(processSpigotMapping)
    ssJar = spigotBuildToolsDir.get().file('BuildData/bin/SpecialSource.jar').asFile
    inJar = spigotJar.get().asFile
    inSrg = spigotMappingDir.get().file('bukkit_srg.srg').asFile
    inSrgToStable = project(':common').layout.buildDirectory.file('moddev/artifacts/intermediateToNamed.srg').get().asFile
    inheritanceMap = spigotMappingDir.get().file('inheritanceMap.txt').asFile
    outJar = spigotWorkDir.get().file('spigot-1.20.1-mapped.jar').asFile
    outDeobf = spigotWorkDir.get().file('spigot-1.20.1-mapped-deobf.jar').asFile
    inAt = layout.projectDirectory.file('common/bukkit.at').get().asFile
    bukkitVersion = 'v1_20_R1'
    includes.add('net/minecraft/world/level/block/ChestBlock$DoubleInventory')
}

def distributionDir = layout.buildDirectory.dir('distributions')
def projectVersion = providers.gradleProperty('version').get()
def mcVersion = providers.gradleProperty('minecraft_version').get()
def loaderVersion = providers.gradleProperty('forge_version').get()
def fabricLoaderVersion = providers.gradleProperty('fabric_loader_version').get()

def assembleForgeMod = tasks.register('assembleForgeMod', Copy) {
    group = 'build'
    description = 'Assembles the standard Luminara Forge mod JAR and its checksum.'
    dependsOn(':forge:jar')
    from(project(':forge').tasks.named('jar').flatMap { it.archiveFile })
    into(distributionDir)
    rename { "luminara-forge-${mcVersion}-${projectVersion}.jar" }
    doLast {
        def jar = distributionDir.get().file("luminara-forge-${mcVersion}-${projectVersion}.jar").asFile
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        jar.eachByte(8192) { bytes, size -> digest.update(bytes, 0, size) }
        new File(jar.parentFile, jar.name + '.sha256').text =
                digest.digest().collect { String.format('%02x', it) }.join() + "  ${jar.name}\n"
    }
}

def assembleFabricMod = tasks.register('assembleFabricMod', Copy) {
    group = 'build'
    description = 'Assembles the standard Luminara Fabric mod JAR and its checksum.'
    dependsOn(':fabric:remapJar')
    from(project(':fabric').tasks.named('remapJar').flatMap { it.archiveFile })
    into(distributionDir)
    rename { "luminara-fabric-${mcVersion}-${projectVersion}.jar" }
    doLast {
        def jar = distributionDir.get().file("luminara-fabric-${mcVersion}-${projectVersion}.jar").asFile
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        jar.eachByte(8192) { bytes, size -> digest.update(bytes, 0, size) }
        new File(jar.parentFile, jar.name + '.sha256').text =
                digest.digest().collect { String.format('%02x', it) }.join() + "  ${jar.name}\n"
    }
}

tasks.register('assemble') {
    group = 'build'
    description = 'Assembles both loader distributions.'
    dependsOn(assembleForgeMod, assembleFabricMod)
}

tasks.register('verifyForgeModDistribution', org.craftamethyst.luminara.gradle.tasks.VerifyForgeModTask) {
    group = 'verification'
    description = 'Validates the assembled Forge mod JAR metadata and mixin configuration.'
    dependsOn(assembleForgeMod)
    modJar.set(distributionDir.map { it.file("luminara-forge-${mcVersion}-${projectVersion}.jar") })
    modId.set('luminara')
    minecraftVersion.set(mcVersion)
    forgeVersion.set(loaderVersion)
    expectedVersionPrefix.set(projectVersion)
    requiredEntries.set([
            'META-INF/mods.toml',
            'META-INF/accesstransformer.cfg',
            'META-INF/luminara-version.properties',
            'META-INF/MANIFEST.MF',
            'mixins.arclight.refmap.json',
            'mixins.arclight.forge.refmap.json',
            'pack.mcmeta',
            'org/craftamethyst/luminara/common/mod/ArclightMod.class',
            'org/craftamethyst/luminara/common/mod/ArclightConnector.class',
            'org/craftamethyst/luminara/common/mixin/core/commands/CommandNodeMixin.class',
            'org/craftamethyst/luminara/common/mixin/bukkit/enumvalues/MaterialEnumMixin.class'
    ])
    mixinConfigurations.set([
            'mixins.arclight.forge.json',
            'mixins.arclight.forge.compat.json',
            'mixins.arclight.impl.forge.optimization.json'
    ])
    expectedManifestAttributes.set([
            'MixinConnector': 'org.craftamethyst.luminara.common.mod.ArclightConnector'
    ])
}

tasks.register('verifyFabricModDistribution') {
    group = 'verification'
    description = 'Validates the assembled Fabric mod JAR metadata and mixin configuration.'
    dependsOn(assembleFabricMod)
    doLast {
        def jar = distributionDir.get().file("luminara-fabric-${mcVersion}-${projectVersion}.jar").asFile
        if (!jar.isFile()) throw new GradleException("Missing ${jar}")
        new java.util.zip.ZipFile(jar).withCloseable { zip ->
            def names = zip.entries().collect { it.name } as Set
            ['fabric.mod.json', 'mixins.arclight.core.fabric.json',
             'mixins.arclight.bukkit.fabric.json', 'mixins.arclight.fabric.json',
             'org/craftamethyst/luminara/fabric/LuminaraFabric.class',
             'org/craftamethyst/luminara/fabric/FabricCommonApi.class'].each { required ->
                if (!names.contains(required)) throw new GradleException("Missing ${required} in ${jar.name}")
            }
            if (names.contains('META-INF/mods.toml')) {
                throw new GradleException('Fabric JAR must not contain META-INF/mods.toml')
            }
            def meta = new groovy.json.JsonSlurper().parse(zip.getInputStream(zip.getEntry('fabric.mod.json')))
            if (meta.id != 'luminara') throw new GradleException("Unexpected Fabric mod id: ${meta.id}")
            if (!(meta.entrypoints?.main?.contains('org.craftamethyst.luminara.fabric.LuminaraFabric'))) {
                throw new GradleException('Fabric main entrypoint is missing')
            }
        }
    }
}

tasks.register('check') {
    group = 'verification'
    description = 'Runs every module check plus both distribution validations.'
    dependsOn(subprojects.collect { it.tasks.matching { task -> task.name == 'check' } })
    dependsOn('verifyForgeModDistribution', 'verifyFabricModDistribution')
}

tasks.register('smokeServer') {
    group = 'verification'
    description = 'Runs the Forge dedicated-server smoke test.'
    dependsOn(':forge:runServer')
}

tasks.register('smokeFabricServer') {
    group = 'verification'
    description = 'Runs the Fabric dedicated-server smoke test.'
    dependsOn(':fabric:runServer')
}

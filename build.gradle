import io.izzel.arclight.gradle.ArclightGradlePlugin
import io.izzel.arclight.gradle.tasks.AssembleDistributionTask
import io.izzel.arclight.gradle.tasks.VerifyDistributionTask
import io.izzel.arclight.gradle.tasks.VerifyLauncherBoundaryTask
import io.izzel.arclight.gradle.tasks.VerifyModDistributionTask
import org.gradle.jvm.toolchain.JavaToolchainService
import org.gradle.api.tasks.bundling.AbstractArchiveTask
import org.gradle.api.tasks.bundling.Jar

import java.time.Instant
import java.time.ZoneOffset
import java.time.format.DateTimeFormatter

plugins {
    alias libs.plugins.architectury.plugin apply false
    id 'dev.architectury.loom' apply false // Already supplied by buildSrc at the catalog version.
    alias libs.plugins.gradleup.shadow apply false
}

def commandOutput = { List<String> command ->
    def stdout = new ByteArrayOutputStream()
    try {
        def result = exec {
            commandLine command
            standardOutput = stdout
            errorOutput = new ByteArrayOutputStream()
            ignoreExitValue = true
        }
        return result.exitValue == 0 ? stdout.toString('UTF-8').trim() : null
    } catch (Exception ignored) {
        return null
    }
}

def explicitGitHash = providers.gradleProperty('luminaraGitHash').orNull
if (explicitGitHash != null && !(explicitGitHash ==~ /[0-9a-f]{7,40}/)) {
    throw new GradleException('luminaraGitHash must contain 7-40 lowercase hexadecimal characters')
}
def resolvedGitHash = explicitGitHash ?: commandOutput(['git', 'rev-parse', '--short', 'HEAD']) ?: 'unknown'

def epochText = providers.environmentVariable('SOURCE_DATE_EPOCH').orNull
def gitEpoch = epochText ?: commandOutput(['git', 'show', '-s', '--format=%ct', 'HEAD'])
def resolvedGitTimestamp = gitEpoch == null
    ? 'unknown'
    : DateTimeFormatter.ISO_INSTANT.format(Instant.ofEpochSecond(Long.parseLong(gitEpoch)).atOffset(ZoneOffset.UTC))

rootProject.ext.gitHash = resolvedGitHash
rootProject.ext.gitTimestamp = resolvedGitTimestamp

allprojects {
    apply plugin: 'java'

    group 'io.izzel.arclight'
    version libs.versions.project.get()

    ext {
        versionName = 'feudal-kings'
        gitHash = rootProject.ext.gitHash
        gitTimestamp = rootProject.ext.gitTimestamp
        supportedPlatforms = ['neoforge', 'fabric']
        commonProject = project(':arclight-common')
        fabricProject = project(':arclight-fabric')
        neoForgeProject = project(':arclight-neoforge')
        platformProjects = [ext.fabricProject, ext.neoForgeProject]
        subProjects = ext.platformProjects + [ext.commonProject]
        generatedSpigot = "io.izzel.arclight.generated:spigot:${libs.versions.minecraft.get()}:deobf"
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(libs.versions.java.get())
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }

    dependencies {
        compileOnly libs.lombok
        annotationProcessor libs.lombok
        compileOnly libs.jetbrains.annotations
    }

    tasks.register('cleanBuild') {
        doFirst {
            project.file("build/libs").deleteDir()
        }
    }
}

rootProject.ext.subProjects.each { Project p ->
    configure(p) {
        apply plugin: 'architectury-plugin'
        apply plugin: 'dev.architectury.loom'
        apply plugin: ArclightGradlePlugin

        architectury {
            minecraft = libs.versions.minecraft.get()
        }

        loom {
            silentMojangMappingsLicense()
        }

        arclight {
            mcVersion = libs.versions.minecraft.get()
            bukkitVersion = libs.versions.bukkit.api.get()
            spigotReversion = libs.versions.spigot.reversion.get()
            accessTransformer = rootProject.ext.commonProject.file('bukkit.at')
            extraMapping = rootProject.ext.commonProject.file('extra_mapping.tsrg')
        }

        configurations {
            common {
                canBeResolved = true
                canBeConsumed = false
            }

            compileClasspath.extendsFrom common
            runtimeClasspath.extendsFrom common
            developmentForge.extendsFrom common
            developmentFabric.extendsFrom common
            developmentNeoForge.extendsFrom common

            shadowBundle {
                canBeResolved = true
                canBeConsumed = false
            }
        }

        dependencies {
            minecraft libs.minecraft
            mappings loom.layered() {
                officialMojangMappings()
                parchment("org.parchmentmc.data:parchment-${libs.versions.minecraft.get()}:${libs.versions.parchment.get()}@zip")
            }
        }

        java {
            withSourcesJar()
        }
    }
}

rootProject.ext.platformProjects.each { Project p ->
    configure(p) {
        apply plugin: 'dev.architectury.loom'
        apply plugin: 'com.gradleup.shadow'

        loom {
            accessWidenerPath = getRootProject().ext.commonProject.loom.accessWidenerPath
        }

        jar {
            manifest.attributes 'MixinConnector': 'io.izzel.arclight.common.mod.ArclightConnector'
            manifest.attributes 'Implementation-Title': 'Arclight'
            manifest.attributes 'Implementation-Version': "${p.name}-${libs.versions.minecraft.get()}-${project.version}+$gitHash"
            manifest.attributes 'Implementation-Vendor': 'Arclight Team'
            manifest.attributes 'Implementation-Timestamp': gitTimestamp
        }

        components.java {
            withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
                skip()
            }
        }
    }
}

jar.enabled = false

tasks.register('nativeTestPlugin') {
    group = 'verification'
    description = 'Builds the Bukkit plugin used by native M3-M5 integration tests.'
    dependsOn ':native-test-plugin:jar'
}

evaluationDependsOn(':bootstrap')

// Primary install artifacts: the standalone standard mod JARs.
def fabricModJar = project(':arclight-fabric').tasks.named('relocateCraftBukkit', AbstractArchiveTask)
def neoforgeModJar = project(':arclight-neoforge').tasks.named('relocateCraftBukkit', AbstractArchiveTask)

// Legacy launcher distributions, kept as the transitional fallback / regression baseline.
def fabricLauncherJar = project(':bootstrap').tasks.named('fabricJar', Jar)
def neoforgeLauncherJar = project(':bootstrap').tasks.named('neoforgeJar', Jar)

def modDistributionFileName = { String loader -> "luminara-${loader}-${libs.versions.minecraft.get()}-${libs.versions.project.get()}.jar" }

def assembleFabricModDistribution = tasks.register('assembleFabricModDistribution', AssembleDistributionTask) {
    group = 'distribution'
    description = 'Assembles the standalone Fabric mod JAR.'
    inputJar.set(fabricModJar.flatMap { it.archiveFile })
    outputJar.set(layout.buildDirectory.file("distributions/" + modDistributionFileName('fabric')))
}

def assembleNeoForgeModDistribution = tasks.register('assembleNeoForgeModDistribution', AssembleDistributionTask) {
    group = 'distribution'
    description = 'Assembles the standalone NeoForge mod JAR.'
    inputJar.set(neoforgeModJar.flatMap { it.archiveFile })
    // :arclight-neoforge wires its jar-in-jar libraries into nestedLibraries.
    outputJar.set(layout.buildDirectory.file("distributions/" + modDistributionFileName('neoforge')))
}

tasks.register('assembleDistributions') {
    group = 'distribution'
    description = 'Assembles all standalone mod distribution JARs.'
    dependsOn assembleFabricModDistribution, assembleNeoForgeModDistribution
}

def commonMixinEntries = [
    'mixins.arclight.core.json',
    'mixins.arclight.bukkit.json',
    'mixins.arclight.vanilla.json',
    'mixins.arclight.impl.optimization.json'
]

def launcherRemnants = [
    'io/izzel/arclight/server/',
    'io/izzel/arclight/installer/',
    'io/izzel/arclight/boot/',
    'META-INF/installer.json',
    'arclight-server-launch.properties',
    'common.jar',
    'gson.jar',
    'META-INF/services/net.fabricmc.loader.impl.game.GameProvider',
    'META-INF/services/cpw.mods.modlauncher.api.ILaunchHandlerService',
    'META-INF/services/cpw.mods.modlauncher.serviceapi.ILaunchPluginService',
    'META-INF/services/java.util.function.Consumer',
    'META-INF/services/net.neoforged.neoforgespi.locating.IDependencyLocator',
    'META-INF/services/net.neoforged.neoforgespi.locating.IModFileCandidateLocator',
    'META-INF/services/net.neoforged.neoforgespi.locating.IModFileReader'
]

def configureModDistributionVerification = { VerifyModDistributionTask task ->
    task.minecraftVersion.set(libs.versions.minecraft)
    task.javaVersion.set(libs.versions.java)
    task.projectVersion.set(libs.versions.project)
    task.gitCommit.set(rootProject.ext.gitHash)
    task.gitTimestamp.set(rootProject.ext.gitTimestamp)
    task.forbiddenEntries.set(launcherRemnants)
}

def verifyFabricModDistribution = tasks.register('verifyFabricModDistribution', VerifyModDistributionTask) {
    group = 'verification'
    description = 'Verifies the standalone Fabric mod JAR contract.'
    dependsOn assembleFabricModDistribution
    distributionJar.set(assembleFabricModDistribution.flatMap { it.outputJar })
    expectedFileName.set(modDistributionFileName('fabric'))
    moduleName.set('arclight-fabric')
    loader.set('Fabric')
    loaderVersion.set(libs.versions.fabric.loader)
    requiredEntries.set(['fabric.mod.json', 'mixins.arclight.fabric.json'] + commonMixinEntries)
    configureModDistributionVerification(delegate)
    forbiddenEntries.add('META-INF/neoforge.mods.toml')
    forbiddenEntries.add('mixins.arclight.neoforge.json')
}

def verifyNeoForgeModDistribution = tasks.register('verifyNeoForgeModDistribution', VerifyModDistributionTask) {
    group = 'verification'
    description = 'Verifies the standalone NeoForge mod JAR contract.'
    dependsOn assembleNeoForgeModDistribution
    distributionJar.set(assembleNeoForgeModDistribution.flatMap { it.outputJar })
    expectedFileName.set(modDistributionFileName('neoforge'))
    moduleName.set('arclight-neoforge')
    loader.set('NeoForge')
    loaderVersion.set(libs.versions.neoforge)
    requiredEntries.set(['META-INF/neoforge.mods.toml', 'mixins.arclight.neoforge.json', 'META-INF/jarjar/metadata.json'] + commonMixinEntries)
    configureModDistributionVerification(delegate)
    forbiddenEntries.add('fabric.mod.json')
    forbiddenEntries.add('mixins.arclight.fabric.json')
    // SnakeYAML ships as a jar-in-jar entry so NeoForge can collapse it with the copies other
    // mods bundle; a merged copy makes the game layer fail to resolve.
    forbiddenEntries.add('org/yaml/snakeyaml/')
}

tasks.register('verifyDistributions') {
    group = 'verification'
    description = 'Verifies all standalone mod distribution contracts.'
    dependsOn verifyFabricModDistribution, verifyNeoForgeModDistribution
}

// ---------- Legacy launcher fallback (transitional regression baseline) ----------

def commonDistributionEntries = [
    'common.jar',
    'gson.jar',
    'META-INF/installer.json',
    'META-INF/luminara-version.properties',
    'arclight-server-launch.properties',
    'arclight-log4j2.xml',
    'arclight-log4j2-detailed.xml'
]

def assembleFabricLauncherDistribution = tasks.register('assembleFabricLauncherDistribution', AssembleDistributionTask) {
    group = 'distribution'
    description = 'Assembles the legacy Fabric launcher JAR (fallback).'
    inputJar.set(fabricLauncherJar.flatMap { it.archiveFile })
    outputJar.set(layout.buildDirectory.file(fabricLauncherJar.flatMap { it.archiveFileName }.map { "distributions/launcher/${it}" }))
}

def assembleNeoForgeLauncherDistribution = tasks.register('assembleNeoForgeLauncherDistribution', AssembleDistributionTask) {
    group = 'distribution'
    description = 'Assembles the legacy NeoForge launcher JAR (fallback).'
    inputJar.set(neoforgeLauncherJar.flatMap { it.archiveFile })
    outputJar.set(layout.buildDirectory.file(neoforgeLauncherJar.flatMap { it.archiveFileName }.map { "distributions/launcher/${it}" }))
}

def commonSharedRuntimePrefixes = [
    'io/izzel/arclight/api/',
    'io/izzel/arclight/i18n/',
    'io/izzel/arclight/mixin/',
    'io/izzel/tools/'
]

def configureDistributionVerification = { VerifyDistributionTask task ->
    task.minecraftVersion.set(libs.versions.minecraft)
    task.javaVersion.set(libs.versions.java)
    task.projectVersion.set(libs.versions.project)
    task.gitCommit.set(rootProject.ext.gitHash)
    task.gitTimestamp.set(rootProject.ext.gitTimestamp)
    task.mainClass.set('io.izzel.arclight.server.Launcher')
    task.requiredEntries.set(commonDistributionEntries)
    task.expectedNeoForgeVersion.set(libs.versions.neoforge)
    task.expectedFabricLoaderVersion.set(libs.versions.fabric.loader)
    task.ignoredDuplicatePrefixes.set(commonSharedRuntimePrefixes)
}

def verifyFabricLauncherDistribution = tasks.register('verifyFabricLauncherDistribution', VerifyDistributionTask) {
    group = 'verification'
    description = 'Verifies the legacy Fabric launcher distribution contract.'
    dependsOn assembleFabricLauncherDistribution
    distributionJar.set(assembleFabricLauncherDistribution.flatMap { it.outputJar })
    expectedFileName.set(fabricLauncherJar.flatMap { it.archiveFileName })
    loader.set('Fabric')
    loaderVersion.set(libs.versions.fabric.loader)
    launchMainClass.set('io.izzel.arclight.boot.fabric.application.Main_Fabric')
    requiredCommonEntries.set(['fabric.mod.json', 'mixins.arclight.fabric.json'] + commonMixinEntries)
    forbiddenCommonEntries.set(['META-INF/neoforge.mods.toml', 'mixins.arclight.neoforge.json'])
    expectedServices.set([
        'net.fabricmc.loader.impl.game.GameProvider': 'io.izzel.arclight.boot.fabric.mod.ArclightGameProvider'
    ])
    configureDistributionVerification(delegate)
}

def verifyNeoForgeLauncherDistribution = tasks.register('verifyNeoForgeLauncherDistribution', VerifyDistributionTask) {
    group = 'verification'
    description = 'Verifies the legacy NeoForge launcher distribution contract.'
    dependsOn assembleNeoForgeLauncherDistribution
    distributionJar.set(assembleNeoForgeLauncherDistribution.flatMap { it.outputJar })
    expectedFileName.set(neoforgeLauncherJar.flatMap { it.archiveFileName })
    loader.set('NeoForge')
    loaderVersion.set(libs.versions.neoforge)
    launchMainClass.set('io.izzel.arclight.boot.neoforge.application.Main_Neoforge')
    requiredCommonEntries.set(['META-INF/neoforge.mods.toml', 'mixins.arclight.neoforge.json'] + commonMixinEntries)
    forbiddenCommonEntries.set(['fabric.mod.json', 'mixins.arclight.fabric.json'])
    expectedServices.set([
        'cpw.mods.modlauncher.api.ILaunchHandlerService': 'io.izzel.arclight.boot.neoforge.mod.ArclightLaunchHandler',
        'cpw.mods.modlauncher.serviceapi.ILaunchPluginService': 'io.izzel.arclight.boot.neoforge.mod.ArclightImplementer',
        'java.util.function.Consumer': 'io.izzel.arclight.boot.neoforge.application.ApplicationBootstrap',
        'net.neoforged.neoforgespi.locating.IDependencyLocator': 'io.izzel.arclight.boot.neoforge.mod.ArclightJarInJarFilter',
        'net.neoforged.neoforgespi.locating.IModFileCandidateLocator': 'io.izzel.arclight.boot.neoforge.mod.ArclightLocator_Neoforge',
        'net.neoforged.neoforgespi.locating.IModFileReader': 'io.izzel.arclight.boot.neoforge.mod.ArclightModFileReader'
    ])
    configureDistributionVerification(delegate)
}

def javaToolchains = extensions.getByType(JavaToolchainService)
tasks.register('verifyLauncherBoundaries', VerifyLauncherBoundaryTask) {
    group = 'verification'
    description = 'Verifies both legacy launchers reject a missing Minecraft EULA.'
    dependsOn verifyFabricLauncherDistribution, verifyNeoForgeLauncherDistribution
    distributionJars.from(
        assembleFabricLauncherDistribution.flatMap { it.outputJar },
        assembleNeoForgeLauncherDistribution.flatMap { it.outputJar }
    )
    javaExecutable.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(libs.versions.java.get())
    }.map { it.executablePath.asFile.absolutePath })
    outputDirectory.set(layout.buildDirectory.dir('launcher-boundary'))
}

tasks.register('collect', Copy) {
    dependsOn tasks.named('assembleDistributions')
    destinationDir = file('build/libs')
    from assembleFabricModDistribution.flatMap { it.outputJar }
    from assembleNeoForgeModDistribution.flatMap { it.outputJar }
}

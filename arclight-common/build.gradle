import io.izzel.arclight.gradle.tasks.GenerateMappingInventoryTask

import io.izzel.arclight.gradle.tasks.GenerateMixinInventoryTask

import io.izzel.arclight.gradle.tasks.BundleJarJarTask

buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public' }
        mavenCentral()
        maven { url = 'https://maven.izzel.io/releases' }
        // maven { url = 'https://maven.parchmentmc.org' }
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: libs.versions.forgegradle.get()
        // classpath 'org.parchmentmc:librarian:1.+'
        classpath "org.spongepowered:mixingradle:${libs.versions.mixingradle.get()}"
        classpath "io.izzel.arclight:arclight-gradle-plugin:${libs.versions.arclight.gradle.plugin.get()}"
    }
}

apply plugin: 'net.minecraftforge.gradle'
// apply plugin: 'org.parchmentmc.librarian.forgegradle'
apply plugin: 'org.spongepowered.mixin'
apply plugin: 'luminara.java-conventions'
apply plugin: 'idea'
apply plugin: 'io.izzel.arclight'

base.archivesName = "luminara-common-${minecraftVersion}"

arclight {
    mcVersion = minecraftVersion
    forgeVersion = project.ext.forgeVersion
    bukkitVersion = libs.versions.bukkit.package.get()
    sharedSpigot = true
    wipeVersion = true
    reobfVersion = true
    accessTransformer = project.file('bukkit.at')
    // packageName = 'spigot'
}

configurations {
    embed {
        // Everything on embed lands inside the mod JAR. Forge already puts ASM, Gson,
        // Guava, commons-lang3, log4j and friends on the module path, so a bundled copy of
        // any of them becomes a second module exporting the same packages and Java refuses
        // to build the game layer. Only the leaf artifact of each library is embedded; its
        // transitive dependencies are expected from Forge.
        transitive = false
    }
    reobfuscatedElements {
        canBeConsumed = true
        canBeResolved = false
    }
}

sourceSets {
    smokePlugin
    smokeMod
}

// The smoke fixtures run inside the server, so they compile against the API the server
// already provides instead of inheriting this module's runtime classpath. Inheriting it
// put a second copy of Forge-provided libraries such as ASM on the module path, which
// makes the module layer fail to resolve. The mod fixture uses a compile-only stub of the
// annotation it needs, so no Forge artifact enters the build.
dependencies {
    smokePluginCompileOnly "org.spigotmc:spigot-api:${libs.versions.spigot.get()}@jar"
}


minecraft {
    //mappings channel: 'parchment', version: "2021.08.22-$minecraftVersion"
    mappings channel: 'official', version: minecraftVersion
    // copyIdeResources = true
    accessTransformer = project.file('src/main/resources/META-INF/accesstransformer.cfg')
}


def mappedSpigotJar = files(layout.buildDirectory.file("arclight_cache/spigot-${minecraftVersion}-mapped-deobf.jar"))
mappedSpigotJar.builtBy(tasks.named('remapSpigotJar'))

dependencies {
    minecraft "net.minecraftforge:forge:$minecraftVersion-$forgeVersion"
    compileOnly mappedSpigotJar
    implementation "org.spigotmc:spigot-api:${libs.versions.spigot.get()}@jar"
    implementation 'org.jetbrains:annotations:23.0.0'

    implementation "org.spongepowered:mixin:${libs.versions.mixin.runtime.get()}"
    annotationProcessor "org.spongepowered:mixin:${libs.versions.mixin.processor.get()}:processor"

    implementation "io.izzel.arclight:mixin-tools:${libs.versions.mixin.tools.get()}"
    annotationProcessor "io.izzel.arclight:mixin-tools:${libs.versions.mixin.tools.get()}"

    implementation 'jline:jline:2.12.1'
    implementation 'net.md-5:SpecialSource:1.11.0'
    implementation "org.apache.logging.log4j:log4j-jul:${libs.versions.log4j.get()}"
    implementation 'net.md-5:bungeecord-chat:1.16-R0.4'
    implementation "com.mysql:mysql-connector-j:${libs.versions.mysql.get()}"
    implementation 'org.yaml:snakeyaml:2.0'
    implementation "io.izzel:tools:$toolsVersion"
    implementation "io.izzel.arclight:arclight-api:$apiVersion"
    implementation project(':i18n-config')

    def adventureArtifacts = [
        'adventure-api',
        'adventure-key',
        'adventure-text-serializer-gson',
        'adventure-text-serializer-json',
        'adventure-text-serializer-legacy',
        'adventure-text-serializer-plain',
        'adventure-text-minimessage',
        'adventure-text-logger-slf4j',
        'examination-api'
    ]
    implementation platform("net.kyori:adventure-bom:${libs.versions.adventure.get()}")
    embed platform("net.kyori:adventure-bom:${libs.versions.adventure.get()}")
    adventureArtifacts.each { artifact ->
        implementation("net.kyori:${artifact}") {
            exclude group: 'org.slf4j'
            exclude group: 'org.checkerframework'
            if (artifact == 'adventure-text-serializer-gson') exclude group: 'com.google.code.gson'
        }
        embed("net.kyori:${artifact}") {
            exclude group: 'org.slf4j'
            exclude group: 'org.checkerframework'
            if (artifact == 'adventure-text-serializer-gson') exclude group: 'com.google.code.gson'
        }
    }

    embed 'net.md-5:bungeecord-chat:1.16-R0.4@jar'
    embed "org.spigotmc:spigot-api:${libs.versions.spigot.get()}@jar"
    embed(project(':i18n-config')) {
        transitive = false
    }
    testImplementation platform("org.junit:junit-bom:${libs.versions.junit.get()}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def jarJarMetadataFile = layout.buildDirectory.file("jarjar/META-INF/jarjar/metadata.json")

/*
 * Libraries Forge does not provide travel as a JarJar payload so each keeps its own
 * module, instead of merging their packages into the mod JAR and colliding with Forge's
 * copies. They come from a detached configuration: declaring them on a project
 * configuration makes ForgeGradle resolve it while it is still building its own
 * repositories, which fails the build.
 * <p>
 * ASM is deliberately absent. Forge already puts it on the module path, and a second
 * nested copy makes the layer fail with "Module forge reads more than one module named
 * org.objectweb.asm".
 */
def jarJarLibraries = [
        "io.izzel:tools:${toolsVersion}",
        "io.izzel.arclight:arclight-api:$apiVersion",
        "io.izzel.arclight:mixin-tools:${libs.versions.mixin.tools.get()}",
        "org.spongepowered:configurate-core:${libs.versions.configurate.get()}",
        "org.spongepowered:configurate-yaml:${libs.versions.configurate.get()}",
        "org.yaml:snakeyaml:2.0",
        'net.md-5:SpecialSource:1.11.0',
        'jline:jline:2.12.1',
        "org.xerial:sqlite-jdbc:${libs.versions.sqlite.get()}",
        "com.mysql:mysql-connector-j:${libs.versions.mysql.get()}"
]
def jarJarFiles = providers.provider {
    def detached = configurations.detachedConfiguration(
            jarJarLibraries.collect { dependencies.create(it) } as org.gradle.api.artifacts.Dependency[])
    detached.transitive = false
    detached.resolve()
}

def bundleJarJar = tasks.register('bundleJarJar', BundleJarJarTask) {
    description = 'Collects the libraries Forge does not provide into a JarJar payload.'
    libraries.from(jarJarFiles)
    coordinates.set(
        providers.provider {
            jarJarLibraries.collectEntries { coordinate ->
                def parts = coordinate.split(':')
                [("${parts[1]}-${parts[2]}.jar".toString()): coordinate]
            }
        }
    )
    metadataFile.set(jarJarMetadataFile)
}

jar {
    manifest.attributes 'MixinConnector': 'io.izzel.arclight.common.mod.ArclightConnector'
    from { configurations.embed.collect { it.isDirectory() ? it : zipTree(it) } } {
        exclude "META-INF/MANIFEST.MF"
        exclude "META-INF/*.SF"
        exclude "META-INF/*.DSA"
        exclude "META-INF/*.RSA"
        exclude "LICENSE.txt"
        exclude "META-INF/services/**"
        exclude "org/apache/commons/lang/enum/**"
        // Forge places every mod on the module path. A bundled library that still carries
        // a module descriptor becomes a named module and then clashes with the copy Forge
        // already provides, so the descriptors are dropped to keep them plain class path
        // entries, exactly like the launcher did.
        exclude "module-info.class"
        exclude "META-INF/versions/*/module-info.class"
    }
    // JarJar payload: one nested JAR per library plus the metadata Forge reads to load it.
    from(jarJarFiles) {
        into 'META-INF/jarjar'
    }
    from(jarJarMetadataFile) {
        into 'META-INF/jarjar'
    }
    dependsOn(bundleJarJar)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

def mainJar = tasks.named('jar', Jar)

def srgJar = tasks.register('srgJar', Jar) {
    from(mainJar.flatMap { it.archiveFile }.map { zipTree(it) }) {
        include 'io/izzel/**'
        exclude 'io/izzel/arclight/common/mixin/**'
    }
    archiveClassifier.set('srg')
}

def spigotJar = tasks.register('spigotJar', Jar) {
    from(srgJar.flatMap { it.archiveFile }.map { zipTree(it) })
    archiveClassifier.set('spigot')
}

def renameSpigotJar = tasks.register('renameSpigotJar', net.minecraftforge.gradle.userdev.tasks.RenameJarInPlace) {
    input.set(spigotJar.flatMap { it.archiveFile })
    hasLog = false
    mappings.set(layout.buildDirectory.file('arclight_cache/tmp_srg/bukkit_srg.srg'))
    args.add('--reverse')
}
spigotJar.configure { finalizedBy(renameSpigotJar) }

def reobfVersionMappingFile = layout.buildDirectory.file("arclight_cache/tmp_srg/reobf_version_${libs.versions.bukkit.package.get()}.srg")
def generateReobfVersionMapping = tasks.register('generateReobfVersionMapping') {
    outputs.file(reobfVersionMappingFile)
    doLast {
        def output = reobfVersionMappingFile.get().asFile
        output.parentFile.mkdirs()
        output.setText("PK: org/bukkit/craftbukkit/v org/bukkit/craftbukkit/${libs.versions.bukkit.package.get()}\n", 'UTF-8')
    }
}
tasks.matching { it.name == 'reobfJar' }.configureEach {
    dependsOn(generateReobfVersionMapping)
}

tasks.withType(net.minecraftforge.gradle.userdev.tasks.RenameJarInPlace).configureEach {
    if (name == 'reobfJar') {
        extraMappings.from(layout.projectDirectory.file('extra_mapping.tsrg'))
    }
}

artifacts {
    add('reobfuscatedElements', mainJar) {
        builtBy(tasks.matching { it.name == 'reobfJar' })
    }
}


processResources {
    filesMatching("**/mods.toml") {
        expand 'version': "$minecraftVersion-${project.version}-$gitHash"
    }
}
processSmokeModResources {
    filesMatching("META-INF/mods.toml") {
        expand 'forgeVersion': forgeVersion
    }
}

def smokePluginJar = tasks.register('smokePluginJar', Jar) {
    archiveFileName.set('luminara-smoke-plugin.jar')
    destinationDirectory.set(layout.buildDirectory.dir('smoke-fixtures'))
    from(sourceSets.smokePlugin.output)
}

def smokeModJar = tasks.register('smokeModJar', Jar) {
    archiveFileName.set('luminara-smoke-mod.jar')
    destinationDirectory.set(layout.buildDirectory.dir('smoke-fixtures'))
    from(sourceSets.smokeMod.output) {
        // Compile-only stub of the Forge annotation; the server provides the real one.
        exclude 'net/minecraftforge/**'
    }
}

tasks.named('compileSmokePluginJava') {
    dependsOn(tasks.named('remapSpigotJar'))
}

tasks.named('compileSmokeModJava') {
    dependsOn(tasks.named('remapSpigotJar'))
}

remapSpigotJar {
    includes.add('net/minecraft/world/level/block/ChestBlock$DoubleInventory')
}

mixin {
    add sourceSets.main, 'mixins.arclight.refmap.json'
    extraMappings(project.file('extra_mapping.tsrg').absolutePath)
}

def generateMixinInventory = tasks.register('generateMixinInventory', GenerateMixinInventoryTask) {
    dependsOn(tasks.named('classes'))
    configFiles.from([
            'mixins.arclight.core.json',
            'mixins.arclight.bukkit.json',
            'mixins.arclight.forge.json',
            'mixins.arclight.compat.json'
    ].collect { layout.projectDirectory.file("src/main/resources/${it}") })
    mixinClasses.from(sourceSets.main.output.classesDirs)
    targetClasspath.from(sourceSets.main.compileClasspath)
    targetClasspath.from(layout.buildDirectory.file("fg_cache/net/minecraftforge/forge/${minecraftVersion}-${forgeVersion}/forge-${minecraftVersion}-${forgeVersion}-injected.jar"))
    outputFile.set(rootProject.layout.buildDirectory.file('reports/mixins/inventory.json'))
}

def generateMappingInventory = tasks.register('generateMappingInventory', GenerateMappingInventoryTask) {
    dependsOn(tasks.named('compileJava'), tasks.named('remapSpigotJar'))
    forgeAccessTransformer.set(layout.projectDirectory.file('src/main/resources/META-INF/accesstransformer.cfg'))
    bukkitAccessTransformer.set(layout.projectDirectory.file('bukkit.at'))
    forgeAccessLog.set(layout.buildDirectory.file('_atJar_4/accesstransform.log'))
    extraMappings.set(layout.projectDirectory.file('extra_mapping.tsrg'))
    srgMappings.set(layout.buildDirectory.file('createMcpToSrg/output.tsrg'))
    bukkitJar.set(rootProject.layout.buildDirectory.file("arclight_cache/buildtools/spigot-${minecraftVersion}.jar"))
    bukkitPatchJar.set(layout.buildDirectory.file("arclight_cache/spigot-${minecraftVersion}-mapped-deobf.jar"))
    bukkitMappings.set(layout.buildDirectory.file('arclight_cache/tmp_srg/bukkit_srg.srg'))
    minecraftClasspath.from(layout.buildDirectory.file("fg_cache/net/minecraftforge/forge/${minecraftVersion}-${forgeVersion}_mapped_official_${minecraftVersion}/forge-${minecraftVersion}-${forgeVersion}_mapped_official_${minecraftVersion}.jar"))
    referenceSources.from(fileTree('src/main/java') { include '**/*.java' })
    generatedRemapperInputs.from(
            layout.buildDirectory.file('arclight_cache/tmp_srg/bukkit_srg.srg'),
            layout.buildDirectory.file('arclight_cache/tmp_srg/inheritanceMap.txt')
    )
    outputFile.set(rootProject.layout.buildDirectory.file('reports/mappings/inventory.json'))
}

tasks.named('check') {
    dependsOn(generateMixinInventory, generateMappingInventory)
}

compileJava {
    options.compilerArgs << '-XDignore.symbol.file' << '-XDenableSunApiLintControl'
}

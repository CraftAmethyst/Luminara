buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public' }
        mavenCentral()
        maven { url = 'https://maven.izzel.io/releases' }
        // maven { url = 'https://maven.parchmentmc.org' }
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: libs.versions.forgegradle.get()
        // classpath 'org.parchmentmc:librarian:1.+'
        classpath "org.spongepowered:mixingradle:${libs.versions.mixingradle.get()}"
        classpath "io.izzel.arclight:arclight-gradle-plugin:${libs.versions.arclight.gradle.plugin.get()}"
    }
}

apply plugin: 'net.minecraftforge.gradle'
// apply plugin: 'org.parchmentmc.librarian.forgegradle'
apply plugin: 'org.spongepowered.mixin'
apply plugin: 'luminara.java-conventions'
apply plugin: 'idea'
apply plugin: 'io.izzel.arclight'

base.archivesName = "luminara-common-${minecraftVersion}"

arclight {
    mcVersion = minecraftVersion
    forgeVersion = project.ext.forgeVersion
    bukkitVersion = libs.versions.bukkit.package.get()
    wipeVersion = true
    reobfVersion = true
    accessTransformer = project.file('bukkit.at')
    // packageName = 'spigot'
}

configurations {
    embed
    reobfuscatedElements {
        canBeConsumed = true
        canBeResolved = false
    }
}


minecraft {
    //mappings channel: 'parchment', version: "2021.08.22-$minecraftVersion"
    mappings channel: 'official', version: minecraftVersion
    // copyIdeResources = true
    accessTransformer = project.file('src/main/resources/META-INF/accesstransformer.cfg')
}


dependencies {
    minecraft "net.minecraftforge:forge:$minecraftVersion-$forgeVersion"
    implementation "org.spigotmc:spigot-api:${libs.versions.spigot.get()}@jar"
    implementation 'org.jetbrains:annotations:23.0.0'

    implementation "org.spongepowered:mixin:${libs.versions.mixin.runtime.get()}"
    annotationProcessor "org.spongepowered:mixin:${libs.versions.mixin.runtime.get()}:processor"

    implementation "com.github.ArclightTeam:mixin-tools:${libs.versions.mixin.tools.get()}"
    annotationProcessor "com.github.ArclightTeam:mixin-tools:${libs.versions.mixin.tools.get()}"

    implementation 'jline:jline:2.12.1'
    implementation 'net.md-5:SpecialSource:1.11.0'
    implementation 'org.apache.logging.log4j:log4j-jul:2.15.0'
    implementation 'net.md-5:bungeecord-chat:1.16-R0.4'
    implementation 'mysql:mysql-connector-java:5.1.49'
    implementation 'org.yaml:snakeyaml:2.0'
    implementation "io.izzel:tools:$toolsVersion"
    implementation "io.izzel.arclight:arclight-api:$apiVersion"
    implementation project(':i18n-config')

    // Adventure dependencies - core only to avoid conflicts
    implementation("net.kyori:adventure-api:4.17.0") {
        exclude group: 'org.slf4j'
        exclude group: 'org.checkerframework'
    }
    implementation("net.kyori:adventure-text-serializer-gson:4.17.0") {
        exclude group: 'org.slf4j'
        exclude group: 'org.checkerframework'
        exclude group: 'com.google.code.gson'
    }
    implementation("net.kyori:adventure-text-serializer-legacy:4.17.0") {
        exclude group: 'org.slf4j'
        exclude group: 'org.checkerframework'
    }
    implementation("net.kyori:adventure-text-serializer-plain:4.17.0") {
        exclude group: 'org.slf4j'
        exclude group: 'org.checkerframework'
    }
    implementation("net.kyori:adventure-text-minimessage:4.17.0") {
        exclude group: 'org.slf4j'
        exclude group: 'org.checkerframework'
    }


    embed 'net.md-5:bungeecord-chat:1.16-R0.4@jar'
    embed "org.spigotmc:spigot-api:${libs.versions.spigot.get()}@jar"
    embed("net.kyori:adventure-api:4.17.0") {
        exclude group: 'org.slf4j'
        exclude group: 'org.checkerframework'
    }
    embed("net.kyori:adventure-text-serializer-gson:4.17.0") {
        exclude group: 'org.slf4j'
        exclude group: 'org.checkerframework'
        exclude group: 'com.google.code.gson'
    }
    embed("net.kyori:adventure-text-serializer-legacy:4.17.0") {
        exclude group: 'org.slf4j'
        exclude group: 'org.checkerframework'
    }
    embed("net.kyori:adventure-text-serializer-plain:4.17.0") {
        exclude group: 'org.slf4j'
        exclude group: 'org.checkerframework'
    }
    embed("net.kyori:adventure-text-minimessage:4.17.0") {
        exclude group: 'org.slf4j'
        exclude group: 'org.checkerframework'
    }

    embed("net.kyori:adventure-text-logger-slf4j:4.17.0") {
        exclude group: 'org.slf4j'
        exclude group: 'org.checkerframework'
    }
}

jar {
    manifest.attributes 'MixinConnector': 'io.izzel.arclight.common.mod.ArclightConnector'
    from { configurations.embed.collect { it.isDirectory() ? it : zipTree(it) } } {
        exclude "META-INF/MANIFEST.MF"
        exclude "META-INF/*.SF"
        exclude "META-INF/*.DSA"
        exclude "META-INF/*.RSA"
        exclude "LICENSE.txt"
        exclude "META-INF/services/**"
        exclude "org/apache/commons/lang/enum/**"
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

def mainJar = tasks.named('jar', Jar)

def srgJar = tasks.register('srgJar', Jar) {
    from(mainJar.flatMap { it.archiveFile }.map { zipTree(it) }) {
        include 'io/izzel/**'
        exclude 'io/izzel/arclight/common/mixin/**'
    }
    archiveClassifier.set('srg')
}

def spigotJar = tasks.register('spigotJar', Jar) {
    from(srgJar.flatMap { it.archiveFile }.map { zipTree(it) })
    archiveClassifier.set('spigot')
}

def renameSpigotJar = tasks.register('renameSpigotJar', net.minecraftforge.gradle.userdev.tasks.RenameJarInPlace) {
    input.set(spigotJar.flatMap { it.archiveFile })
    hasLog = false
    mappings.set(layout.buildDirectory.file('arclight_cache/tmp_srg/bukkit_srg.srg'))
    args.add('--reverse')
}
spigotJar.configure { finalizedBy(renameSpigotJar) }

tasks.withType(net.minecraftforge.gradle.userdev.tasks.RenameJarInPlace).configureEach {
    if (name == 'reobfJar') {
        extraMappings.from(layout.projectDirectory.file('extra_mapping.tsrg'))
    }
}

artifacts {
    add('reobfuscatedElements', mainJar) {
        builtBy(tasks.matching { it.name == 'reobfJar' })
    }
}

processResources {
    filesMatching("**/mods.toml") {
        expand 'version': "$minecraftVersion-${project.version}-$gitHash"
    }
}

remapSpigotJar {
    includes.add('net/minecraft/world/level/block/ChestBlock$DoubleInventory')
}

mixin {
    add sourceSets.main, 'mixins.arclight.refmap.json'
}

compileJava {
    options.compilerArgs << '-XDignore.symbol.file' << '-XDenableSunApiLintControl'
}

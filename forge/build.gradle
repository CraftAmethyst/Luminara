plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev.legacyforge'
}

repositories {
    maven {
        name = 'Izzel'
        url = 'https://maven.izzel.io/releases'
        content {
            includeGroupByRegex 'io\\.izzel(\\..*)?'
            includeGroup 'net.md-5'
        }
    }
    maven {
        name = 'ForgeMaven'
        url = 'https://maven.minecraftforge.net'
        content { includeGroup 'net.minecraftforge' }
    }
    maven {
        name = 'JitPack'
        url = 'https://jitpack.io'
        content { includeGroupByRegex 'com\\.github\\.ArclightTeam(\\..*)?' }
    }
    ivy {
        name = 'SpigotPinnedSnapshot'
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots'
        patternLayout {
            artifact '[organisation]/[module]/1.20.1-R0.1-SNAPSHOT/[module]-[revision](-[classifier]).[ext]'
            setM2compatible(true)
        }
        metadataSources { artifact() }
        content { includeGroupByRegex 'org\\.spigotmc(\\..*)?' }
    }
}

mixin {
    add(sourceSets.main, 'luminara.refmap.json')
}

def forgeBundle = configurations.create('forgeBundle') {
    canBeConsumed = false
    canBeResolved = true
    transitive = false
}

def libraryResolver = configurations.create('libraryResolver') {
    canBeConsumed = false
    canBeResolved = true
}

def bundledLibsDir = layout.buildDirectory.dir('bundled-libs')
def extractBundledLibs = tasks.register('extractBundledLibs', Sync) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({ forgeBundle.collect { zipTree(it) } }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
        exclude 'META-INF/services/**'
        exclude 'module-info.class'
        exclude 'META-INF/versions/*/module-info.class'
        exclude 'org/apache/logging/**'
        exclude 'com/google/gson/**'
        exclude 'com/google/common/**'
        exclude 'org/objectweb/asm/**'
        exclude 'org/slf4j/**'
        exclude 'org/apache/commons/**'
    }
    from({ libraryResolver.collect { zipTree(it) } }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
        exclude 'META-INF/services/**'
        exclude 'module-info.class'
        exclude 'META-INF/versions/*/module-info.class'
        exclude 'org/apache/logging/**'
        exclude 'org/apache/commons/lang3/**'
        exclude 'org/apache/maven/artifact/**'
        exclude 'org/apache/maven/repository/Proxy.class'
        exclude 'org/apache/maven/repository/legacy/**'
        exclude 'com/google/gson/**'
        exclude 'com/google/common/**'
        exclude 'org/objectweb/asm/**'
        exclude 'org/slf4j/**'
    }
    from({ zipTree(project(':common').file('libs/spigot-1.20.1-mapped-deobf.jar')) }) {
        include 'org/bukkit/craftbukkit/**'
        include 'org/spigotmc/**'
        include 'configurations/**'
    }
    into bundledLibsDir
}

sourceSets {
    bundledLibs {
        output.dir(bundledLibsDir, builtBy: extractBundledLibs)
    }
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    validateAccessTransformers = false

    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers = [at]
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        client {
            client()
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet project(':common').sourceSets.main
            sourceSet sourceSets.bundledLibs
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    compileOnly project(":common")
    annotationProcessor "org.spongepowered:mixin:${libs.versions.mixin.processor.get()}:processor"
    annotationProcessor "io.izzel.arclight:mixin-tools:${libs.versions.mixin.tools.get()}"
    annotationProcessor "org.apache.logging.log4j:log4j-core:${libs.versions.log4j.get()}"
    testImplementation project(":common")
    testImplementation platform("org.junit:junit-bom:5.14.4")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher' 
    add('forgeBundle', "io.izzel:tools:${libs.versions.tools.get()}")
    add('forgeBundle', "io.izzel.arclight:arclight-api:${libs.versions.arclight.api.get()}")
    add('forgeBundle', "io.izzel.arclight:mixin-tools:${libs.versions.mixin.tools.get()}")
    add('forgeBundle', "org.spongepowered:configurate-core:${libs.versions.configurate.get()}")
    add('forgeBundle', "org.spongepowered:configurate-yaml:${libs.versions.configurate.get()}")
    add('forgeBundle', 'org.yaml:snakeyaml:2.0')
    add('forgeBundle', 'net.md-5:SpecialSource:1.11.0')
    add('forgeBundle', 'jline:jline:2.12.1')
    add('forgeBundle', "org.xerial:sqlite-jdbc:${libs.versions.sqlite.get()}")
    add('forgeBundle', "com.mysql:mysql-connector-j:${libs.versions.mysql.get()}")
    add('forgeBundle', "org.apache.logging.log4j:log4j-jul:${libs.versions.log4j.get()}")
    add('forgeBundle', 'net.md-5:bungeecord-chat:1.16-R0.4')
    add('forgeBundle', "org.spigotmc:spigot-api:${libs.versions.spigot.get()}@jar")
    ['adventure-api', 'adventure-key', 'adventure-text-serializer-gson',
     'adventure-text-serializer-json', 'adventure-text-serializer-legacy',
     'adventure-text-serializer-plain', 'adventure-text-minimessage',
     'adventure-text-logger-slf4j'].each { artifact ->
        add('forgeBundle', "net.kyori:${artifact}:${libs.versions.adventure.get()}")
    }
    add('forgeBundle', 'net.kyori:examination-api:1.3.0')

    // Spigot declares these Maven Resolver components as provided; bundle them for plugin.yml libraries.
    add('libraryResolver', 'org.apache.maven:maven-resolver-provider:3.8.5')
    add('libraryResolver', 'org.apache.maven.resolver:maven-resolver-connector-basic:1.7.3')
    add('libraryResolver', 'org.apache.maven.resolver:maven-resolver-transport-http:1.7.3')
    add('libraryResolver', 'commons-logging:commons-logging:1.2')

}

jar {
    dependsOn(extractBundledLibs)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(sourceSets.bundledLibs.output)
    finalizedBy('reobfJar')
}

tasks.named('compileJava', JavaCompile) {
    
}

jar {
    manifest.attributes([
            'MixinConnector': 'org.craftamethyst.luminara.common.mod.ArclightConnector',
            'MixinConfigs': 'mixins.arclight.core.json,mixins.arclight.bukkit.json,mixins.arclight.forge.json,mixins.arclight.impl.forge.optimization.json,mixins.arclight.forge.compat.json'
    ])
    from({ zipTree(project(':common').file('libs/spigot-1.20.1-mapped-deobf.jar')) }) {
        include 'org/bukkit/craftbukkit/**'
        include 'org/spigotmc/**'
    }
}

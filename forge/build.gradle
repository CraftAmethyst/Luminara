plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev.legacyforge'
}

mixin {
    add(sourceSets.main, 'mixins.arclight.forge.refmap.json')
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    validateAccessTransformers = false

    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers = [at]
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet project(':common').sourceSets.main
            sourceSet sourceSets.maybeCreate('bundledLibs')
        }
    }
}

def forgeBundle = configurations.create('forgeBundle') {
    canBeConsumed = false
    canBeResolved = true
    transitive = false
}

def bundledLibsDir = layout.buildDirectory.dir('bundled-libs')
def extractBundledLibs = tasks.register('extractBundledLibs', Sync) {
    from({ forgeBundle.collect { zipTree(it) } }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
        exclude 'META-INF/services/**'
        exclude 'module-info.class'
        exclude 'META-INF/versions/*/module-info.class'
        exclude 'org/apache/logging/**'
        exclude 'com/google/gson/**'
        exclude 'com/google/common/**'
        exclude 'org/objectweb/asm/**'
        exclude 'org/slf4j/**'
        exclude 'org/apache/commons/**'
    }
    from({ zipTree(project(':common').file('libs/spigot-1.20.1-mapped-deobf.jar')) }) {
        include 'org/bukkit/craftbukkit/**'
        include 'org/spigotmc/**'
    }
    into bundledLibsDir
}

sourceSets {
    bundledLibs {
        output.dir(bundledLibsDir, builtBy: extractBundledLibs)
    }
}

dependencies {
    add('forgeBundle', "io.izzel:tools:${libs.versions.tools.get()}")
    add('forgeBundle', "io.izzel.arclight:arclight-api:${libs.versions.arclight.api.get()}")
    add('forgeBundle', "io.izzel.arclight:mixin-tools:${libs.versions.mixin.tools.get()}")
    add('forgeBundle', "org.spongepowered:configurate-core:${libs.versions.configurate.get()}")
    add('forgeBundle', "org.spongepowered:configurate-yaml:${libs.versions.configurate.get()}")
    add('forgeBundle', 'org.yaml:snakeyaml:2.0')
    add('forgeBundle', 'net.md-5:SpecialSource:1.11.0')
    add('forgeBundle', 'jline:jline:2.12.1')
    add('forgeBundle', "org.xerial:sqlite-jdbc:${libs.versions.sqlite.get()}")
    add('forgeBundle', "com.mysql:mysql-connector-j:${libs.versions.mysql.get()}")
    add('forgeBundle', "org.apache.logging.log4j:log4j-jul:${libs.versions.log4j.get()}")
    add('forgeBundle', 'net.md-5:bungeecord-chat:1.16-R0.4')
    add('forgeBundle', "org.spigotmc:spigot-api:${libs.versions.spigot.get()}@jar")
    ['adventure-api', 'adventure-key', 'adventure-text-serializer-gson',
     'adventure-text-serializer-json', 'adventure-text-serializer-legacy',
     'adventure-text-serializer-plain', 'adventure-text-minimessage',
     'adventure-text-logger-slf4j'].each { artifact ->
        add('forgeBundle', "net.kyori:${artifact}:${libs.versions.adventure.get()}")
    }
    add('forgeBundle', 'net.kyori:examination-api:1.3.0')
    add('forgeBundle', 'net.kyori:examination-string:1.3.0')
}

def commonJar = project(':common').tasks.named('jar').flatMap { it.archiveFile }
def mappedSpigotJar = project(':common').file('libs/spigot-1.20.1-mapped-deobf.jar')

dependencies {
    compileOnly(project(':common')) { transitive = false }
    implementation(project(':common')) { transitive = false }
    compileOnly files(mappedSpigotJar)
    implementation "org.spigotmc:spigot-api:${libs.versions.spigot.get()}@jar"
    implementation "io.izzel.arclight:arclight-api:${libs.versions.arclight.api.get()}"
    implementation "io.izzel:tools:${libs.versions.tools.get()}"
    implementation "io.izzel.arclight:mixin-tools:${libs.versions.mixin.tools.get()}"
    implementation "org.spongepowered:configurate-yaml:${libs.versions.configurate.get()}"
    implementation "org.apache.logging.log4j:log4j-jul:${libs.versions.log4j.get()}"
    implementation 'net.md-5:bungeecord-chat:1.16-R0.4'
    implementation 'net.md-5:SpecialSource:1.11.0'
    implementation 'jline:jline:2.12.1'
    implementation 'org.yaml:snakeyaml:2.0'
    implementation "com.mysql:mysql-connector-j:${libs.versions.mysql.get()}"
    implementation 'org.jetbrains:annotations:23.0.0'
    implementation platform("net.kyori:adventure-bom:${libs.versions.adventure.get()}")
    implementation 'net.kyori:adventure-api'
    implementation 'net.kyori:adventure-key'
    implementation 'net.kyori:adventure-text-serializer-gson'
    implementation 'net.kyori:adventure-text-serializer-json'
    implementation 'net.kyori:adventure-text-serializer-legacy'
    implementation 'net.kyori:adventure-text-serializer-plain'
    implementation 'net.kyori:adventure-text-minimessage'
    implementation 'net.kyori:adventure-text-logger-slf4j'
    implementation 'net.kyori:examination-api'
    annotationProcessor "org.spongepowered:mixin:${libs.versions.mixin.processor.get()}:processor"
}

jar {
    dependsOn(project(':common').tasks.named('jar'))
    finalizedBy('reobfJar')

    from({ zipTree(commonJar.get().asFile) }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
        exclude 'META-INF/mods.toml'
        exclude 'META-INF/services/**'
        exclude 'module-info.class'
        exclude 'META-INF/versions/*/module-info.class'
        exclude 'net/minecraft/**'
    }

    manifest.attributes([
            'MixinConnector': 'org.craftamethyst.luminara.common.mod.ArclightConnector',
            'MixinConfigs'  : 'mixins.arclight.forge.json,mixins.arclight.impl.forge.optimization.json,mixins.arclight.forge.compat.json'
    ])
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

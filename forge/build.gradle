plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev.legacyforge'
}

repositories {
    maven {
        name = 'Izzel'
        url = 'https://maven.izzel.io/releases'
        content {
            includeGroupByRegex 'io\\.izzel(\\..*)?'
            includeGroup 'net.md-5'
        }
    }
    maven {
        name = 'ForgeMaven'
        url = 'https://maven.minecraftforge.net'
        content { includeGroup 'net.minecraftforge' }
    }
    maven {
        name = 'JitPack'
        url = 'https://jitpack.io'
        content { includeGroupByRegex 'com\\.github\\.ArclightTeam(\\..*)?' }
    }
    ivy {
        name = 'SpigotPinnedSnapshot'
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots'
        patternLayout {
            artifact '[organisation]/[module]/1.20.1-R0.1-SNAPSHOT/[module]-[revision](-[classifier]).[ext]'
            setM2compatible(true)
        }
        metadataSources { artifact() }
        content { includeGroupByRegex 'org\\.spigotmc(\\..*)?' }
    }
}

mixin {
    config('mixins.arclight.core.json')
    config('mixins.arclight.bukkit.json')
    config('mixins.arclight.compat.json')
    config('mixins.arclight.forge.json')
    config('mixins.arclight.impl.forge.optimization.json')
    config('mixins.arclight.forge.compat.json')
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    validateAccessTransformers = false

    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers = [at]
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        client {
            client()
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    compileOnly project(":common")
    testImplementation project(":common")
    testImplementation platform("org.junit:junit-bom:5.14.4")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher' 
}

jar {
    finalizedBy('reobfJar')
    manifest.attributes([
            "MixinConfigs": "mixins.arclight.core.json,mixins.arclight.bukkit.json,mixins.arclight.compat.json,mixins.arclight.forge.json,mixins.arclight.impl.forge.optimization.json,mixins.arclight.forge.compat.json"
    ])
}

tasks.named('compileJava', JavaCompile) {
    
}

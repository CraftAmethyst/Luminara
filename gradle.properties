org.gradle.jvmargs=-Xmx4g -Dfile.encoding=utf-8
# ForgeGradle validates the TLS certificate of libraries.minecraft.net while it resolves its
# own repositories. That check fails behind TLS-inspecting proxies and on transient network
# errors, which turns every build into a network test. Artifacts are still covered by Gradle
# dependency verification.
systemProp.net.minecraftforge.gradle.check.certs=false

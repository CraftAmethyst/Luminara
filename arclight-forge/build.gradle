apply plugin: 'luminara.java-conventions'
apply plugin: 'idea'

base.archivesName = "luminara-forge-${minecraftVersion}"

configurations {
    commonReobfuscated {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    commonReobfuscated project(path: ':arclight-common', configuration: 'reobfuscatedElements')
    testImplementation platform("org.junit:junit-bom:${libs.versions.junit.get()}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// The common runtime is only usable after ForgeGradle has reobfuscated it, so the task
// that produces the mod JAR has to depend on that step explicitly.
compileJava {
    options.compilerArgs << '-XDignore.symbol.file' << '-XDenableSunApiLintControl'
}

/*
 * The published artifact is a plain Forge mod JAR. Every entry that used to live in the
 * nested common.jar is flattened into the root so Forge finds META-INF/mods.toml and the
 * mixin configurations by scanning the mod JAR itself.
 *
 * The reobfuscated common runtime already carries the mixin configurations and the access
 * transformer, so only the resources ForgeGradle generates afterwards are taken from the
 * module output.
 *
 * Two leftovers of the launcher are dropped instead of shipped:
 *  - installer.json described the runtime Forge installer, which no longer exists;
 *  - ChestBlock$DoubleInventory is a Spigot patch of a Minecraft class that no code in
 *    this repository reads. Shipping it would make the mod JAR declare
 *    net.minecraft.world.level.block, which the minecraft module already owns, and Java's
 *    module resolver refuses to build the layer because of the split package.
 */
def modResources = project(':arclight-common').layout.buildDirectory.dir('resources/main')
def generatedRefmap = project(':arclight-common').layout.buildDirectory.file('tmp/compileJava/mixins.arclight.refmap.json')

tasks.named('jar') {
    // The common runtime is only usable after ForgeGradle has reobfuscated it, and the
    // annotation processor output is the authoritative refmap: the copy MixinGradle puts
    // in the common JAR can predate a mapping change, which then makes Mixin resolve
    // @Shadow members by their unmapped names at runtime.
    dependsOn(project(':arclight-common').tasks.matching { it.name == 'reobfJar' })
    dependsOn(project(':arclight-common').tasks.named('compileJava'))
    from(generatedRefmap) {
        rename { 'mixins.arclight.refmap.json' }
    }
}

jar {
    manifest.attributes 'Automatic-Module-Name': 'luminara.forge'
    manifest.attributes 'MixinConnector': 'io.izzel.arclight.common.mod.ArclightConnector'
    from(configurations.commonReobfuscated.collect { it.isDirectory() ? it : zipTree(it) }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
        exclude 'META-INF/mods.toml'
        exclude 'META-INF/installer.json'
        exclude 'META-INF/services/**'
        exclude 'net/minecraft/**'
        exclude 'LICENSE.txt'
        exclude 'module-info.class'
    }
    from(modResources) {
        exclude 'io/**'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

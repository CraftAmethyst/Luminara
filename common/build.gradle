plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev.legacyforge'
}

mixin {
    add(sourceSets.main, 'luminara.refmap.json')
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"
    if (file("src/main/resources/META-INF/accesstransformer.cfg").exists()) {
        accessTransformers = ["src/main/resources/META-INF/accesstransformer.cfg"]
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

repositories {
    maven {
        name = 'Izzel'
        url = 'https://maven.izzel.io/releases'
        content {
            includeGroupByRegex 'io\\.izzel(\\..*)?'
            includeGroup 'net.md-5'
        }
    }
    maven {
        name = 'JitPack'
        url = 'https://jitpack.io'
        content { includeGroupByRegex 'com\\.github\\.ArclightTeam(\\..*)?' }
    }
    maven {
        name = 'ForgeMaven'
        url = 'https://maven.minecraftforge.net'
        content { includeGroup 'net.minecraftforge' }
    }
    ivy {
        name = 'SpigotPinnedSnapshot'
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots'
        patternLayout {
            artifact '[organisation]/[module]/1.20.1-R0.1-SNAPSHOT/[module]-[revision](-[classifier]).[ext]'
            setM2compatible(true)
        }
        metadataSources { artifact() }
        content { includeGroupByRegex 'org\\.spigotmc(\\..*)?' }
    }
}

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    compileOnly group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    compileOnly "net.minecraftforge:eventbus:4.0.0"

    api files('libs/spigot-1.20.1-mapped-deobf.jar')
    api "org.spigotmc:spigot-api:${libs.versions.spigot.get()}@jar"
    api "io.izzel.arclight:arclight-api:${libs.versions.arclight.api.get()}"
    api "io.izzel:tools:${libs.versions.tools.get()}"
    api "io.izzel.arclight:mixin-tools:${libs.versions.mixin.tools.get()}"
    api "org.spongepowered:configurate-core:${libs.versions.configurate.get()}"
    api "org.spongepowered:configurate-yaml:${libs.versions.configurate.get()}"
    api 'org.yaml:snakeyaml:2.0'
    api 'net.md-5:SpecialSource:1.11.0'
    api 'jline:jline:2.12.1'
    api "org.xerial:sqlite-jdbc:${libs.versions.sqlite.get()}"
    api "com.mysql:mysql-connector-j:${libs.versions.mysql.get()}"
    api "org.apache.logging.log4j:log4j-jul:${libs.versions.log4j.get()}"
    api 'net.md-5:bungeecord-chat:1.16-R0.4'
    api 'net.minecrell:terminalconsoleappender:1.2.0'
    api platform("net.kyori:adventure-bom:${libs.versions.adventure.get()}")
    api 'net.kyori:adventure-api'
    api 'net.kyori:adventure-key'
    api 'net.kyori:adventure-text-serializer-gson'
    api 'net.kyori:adventure-text-serializer-json'
    api 'net.kyori:adventure-text-serializer-legacy'
    api 'net.kyori:adventure-text-serializer-plain'
    api 'net.kyori:adventure-text-minimessage'
    api 'net.kyori:adventure-text-logger-slf4j'
    api 'net.kyori:examination-api'

    annotationProcessor "org.spongepowered:mixin:${libs.versions.mixin.processor.get()}:processor"
    annotationProcessor "io.izzel.arclight:mixin-tools:${libs.versions.mixin.tools.get()}"
    annotationProcessor "org.apache.logging.log4j:log4j-core:${libs.versions.log4j.get()}"

    testImplementation platform("org.junit:junit-bom:${libs.versions.junit.get()}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-XDignore.symbol.file' << '-XDenableSunApiLintControl'
}

processResources {
    filesMatching('**/luminara-version.properties') {
        expand 'version': project.version
    }
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.tags = ['author:a:Author', 'reason:a:Reason']
}

comments:
  compatibility:
    symlink-world:
      comment:
      - Crea collegamenti simbolici alla cartella delle dimensioni delle mod che corrisponde
        al nome del mondo Bukki
      - Abilitare questa opzione può migliorare la compatibilità con i plugin
      - Modificare questa impostazione su un server in produzione causerà cambiamenti
        ai nomi dei mondi delle mod
      - '  e provocherà perdita di dati nei plugin che si basano sui nomi dei mondi'
      - Consultare https://github.com/IzzelAliz/Arclight/wiki/World-Symlink per maggiori
        dettagli
    valid-username-regex:
      comment:
      - Espressione regolare per la verifica dei nomi utente validi. Lasciarla vuota
        utilizzerà la verifica standard di vanilla
      - 'La seguente permette caratteri cinesi:'
      - valid-username-regex = "^[ -~\\p{sc=Han}]{1,16}$"
      - 'La seguente permette a qualsiasi nome utente di effettuare il login:'
      - valid-username-regex = ".+"
    forward-permission:
      comment:
      - true - Inoltra la richiesta di permesso di Forge a Bukkit
      - false - Disabilita l'inoltro dei permessi
      - reverse - Inoltra la richiesta di permesso del giocatore Bukkit a Forge
    isolate-plugin-class-loaders:
      comment:
      - Un accesso illegale significa che un plugin carica una classe da un altro
        plugin che non è una sua dipendenza o dipendenza soft
      - Quando viene fornito un nome di pacchetto, non verranno tentati accessi illegali
        alle classi con prefisso uguale al nome del pacchetto.
      - Questo è particolarmente utile quando si verificano problemi di caricamento
        delle classi.
      - 'Attenzione: potrebbe causare malfunzionamenti nei plugin che si basano su
        accessi illegali.'
    extra-logic-worlds:
      comment:
      - Logica di esecuzione dei mondi extra
      - Se alcune mod non funzionano correttamente, prova a cercare nei log i nomi
        delle classi relativi a [EXT_LOGIC] e aggiungili qui
    isolate-adventure-from-modloader:
      comment:
      - Impedisci ai plugin di caricare Kyori Adventure da ModLoader.
      - Questa è solo un’opzione di compatibilità e resterà per ora. Verrà sostituita
        con un meccanismo migliore.
  optimization:
    goal-selector-update-interval:
      comment:
      - Intervallo in tick per aggiornare il selettore degli obiettivi
      - Valori più alti richiedono meno risorse
      - Fa sì che i mob cambino i loro obiettivi meno spesso
    comment: Impostazioni relative all'ottimizzazione
  _v:
    comment:
    - 'Repository: https://github.com/IzzelAliz/Arclight'
    - 'Tracker dei problemi: https://github.com/IzzelAliz/Arclight/issues'
    - ''
    - ''
    - Numero di versione della configurazione, non modificare.
  locale:
    comment: Impostazioni Lingua/I18n
  async-catcher:
    comment:
    - Impostazioni relative ad Async Catcher
    - Ci sono quattro modalità, ed è raccomandata BLOCK
    - NONE - Non fare nulla
    - DISPATCH - Invia l’azione al thread principale senza bloccare
    - BLOCK - Esegui nel thread principale e attendi i risultati
    - EXCEPTION - Genera un errore
    dump:
      comment: Salva le informazioni dello stack trace in debug.log
  velocity:
    secret:
      comment:
      - Il segreto utilizzato per l’inoltro moderno delle informazioni dei giocatori
        su Velocity
    enable:
      comment:
      - Abilita l’inoltro moderno delle informazioni dei giocatori su Velocity

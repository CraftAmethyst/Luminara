_v = 1

locale {
  fallback = "zh_cn"
}
optimization {
  cache-plugin-class = true
  goal-selector-update-interval = 3
  entity-optimization {
    disable-entity-collisions = false
    entity-freeze-timeout = 15000
    reduce-entity-updates = true
    entity-check-interval = 200
    entity-update-distance = 64.0
    max-entities-per-chunk = 100
    max-entities-per-type = 150
    chunk-entity-limit = 20
  }
  chunk-optimization {
    aggressive-chunk-unloading = false
    chunk-unload-delay = 200
    optimize-chunk-loading = false
    chunk-load-rate-limit = 8
  }
  world-creation {
    fast-world-creation = false
    skip-spawn-chunk-loading = false
    force-close-loading-screen = false
    early-world-list-addition = false
    parallel-world-initialization = false
    world-init-timeout-seconds = 45
    max-concurrent-world-loads = 3
    optimize-world-border-setup = false
    defer-spawn-area-preparation = false
    spawn-area-radius = 8
    async-world-data-loading = false
  }
}
compatibility {
  material-property-overrides {
  }
  entity-property-overrides {
  }
  symlink-world = false
  extra-logic-worlds = [
    "com.example.mod.ExtraLogicWorld",
    "xyz.nucleoid.fantasy.RuntimeWorld"
  ]
  forward-permission = true
  valid-username-regex = ""
  lenient-item-tag-match = true
}
async-catcher {
  dump = true
  warn = true
  defaultOperation = block
  overrides {
  }
}
async-world-save {
  enabled = true
  timeout-seconds = 45
  save-world-data = true
}
velocity {
  enabled = false
  online-mode = false
  forwarding-secret = ""
  debug-logging = false
}
error-handling {
  continue-on-crash = false
  crash-report-directory = "crash-reports"
}
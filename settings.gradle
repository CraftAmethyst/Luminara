pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'Forge'
            url = uri('https://maven.minecraftforge.net')
            content {
                includeGroupByRegex 'net\\.minecraftforge(\\..*)?'
                includeGroupByRegex 'cpw\\.mods(\\..*)?'
            }
        }
        maven {
            name = 'Sponge'
            url = uri('https://repo.spongepowered.org/repository/maven-public')
            content { includeGroupByRegex 'org\\.spongepowered(\\..*)?' }
        }
        maven {
            name = 'Izzel'
            url = uri('https://maven.izzel.io/releases')
            content { includeGroupByRegex 'io\\.izzel(\\..*)?' }
        }
    }
}

def configureLuminaraRepositories = { repositories ->
    repositories.mavenCentral()
    repositories.maven {
        name = 'Forge'
        url = uri('https://maven.minecraftforge.net')
        content {
            includeGroupByRegex 'net\\.minecraftforge(\\..*)?'
            includeGroupByRegex 'cpw\\.mods(\\..*)?'
            includeGroup 'de.oceanlabs.mcp'
        }
    }
    repositories.maven {
        name = 'MojangLibraries'
        url = uri('https://libraries.minecraft.net')
        content {
            includeGroupByRegex 'com\\.mojang(\\..*)?'
            includeGroupByRegex 'net\\.minecraft(\\..*)?'
        }
    }
    repositories.maven {
        name = 'Sponge'
        url = uri('https://repo.spongepowered.org/repository/maven-public')
        content { includeGroupByRegex 'org\\.spongepowered(\\..*)?' }
    }
    repositories.ivy {
        name = 'SpigotPinnedSnapshot'
        url = uri('https://hub.spigotmc.org/nexus/content/repositories/snapshots')
        patternLayout {
            artifact '[organisation]/[module]/1.20.1-R0.1-SNAPSHOT/[module]-[revision](-[classifier]).[ext]'
            setM2compatible(true)
        }
        metadataSources { artifact() }
        content { includeGroupByRegex 'org\\.spigotmc(\\..*)?' }
    }
    repositories.maven {
        name = 'Izzel'
        url = uri('https://maven.izzel.io/releases')
        content {
            includeGroupByRegex 'io\\.izzel(\\..*)?'
            includeGroup 'net.md-5'
        }
    }
    repositories.maven {
        name = 'JitPackArclight'
        url = uri('https://jitpack.io')
        content { includeGroupByRegex 'com\\.github\\.ArclightTeam(\\..*)?' }
    }
}

dependencyResolutionManagement {
    // ForgeGradle injects generated Minecraft repositories, so project repositories remain enabled.
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    configureLuminaraRepositories(repositories)
}

gradle.beforeProject { project ->
    configureLuminaraRepositories(project.repositories)
}

rootProject.name = 'luminara'
include 'arclight-common'
include 'forge-installer'
include 'arclight-forge'
include 'i18n-config'

